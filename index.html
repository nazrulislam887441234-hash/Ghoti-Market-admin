<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Strict Anti-SEO & Privacy Headers -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    
    <title>Admin Control Panel</title>
    
    <link rel="icon" type="image/png" href="https://ghotimarket.com/logo.png">
    <meta name="theme-color" content="#f97316">

    <style>
        :root {
            --primary-orange: #f97316;
            --primary-orange-hover: #ea580c;
            --primary-orange-light: #ffedd5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #991b1b;
            --transition-speed: 0.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2rem;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .logo-wrapper {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-wrapper img {
            max-width: 130px;
            height: auto;
            object-fit: contain;
            display: inline-block;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.35rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .alert-box {
            display: none;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            width: 1.25rem;
            height: 1.25rem;
            fill: var(--text-muted);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
            background-color: #ffffff;
            color: var(--text-main);
        }

        .form-input:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px var(--primary-orange-light);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0.25rem;
        }

        .toggle-password svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: var(--text-muted);
            transition: fill var(--transition-speed);
        }

        .toggle-password:hover svg {
            fill: var(--text-main);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color var(--transition-speed), transform 0.1s;
            margin-top: 1.5rem;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: var(--primary-orange-hover);
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .submit-btn svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: currentColor;
        }

        .spinner {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .security-badge svg {
            width: 0.875rem;
            height: 0.875rem;
            fill: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-wrapper">
            <img src="https://ghotimarket.com/logo.png" alt="Ghoti Landing Page">
            <div class="brand-subtitle">Ghoti Landing Page</div>
        </div>

        <div class="login-header">
            <h1>Admin Control Panel</h1>
            <p>Secure access for Owners and Administrators</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert-box"></div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-wrapper">
                    <!-- Inline SVG: Email -->
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="email" id="email" class="form-input" placeholder="admin@ghotimarket.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <!-- Inline SVG: Password -->
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle password visibility">
                        <!-- Inline SVG: Eye (Show) -->
                        <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span id="btnText">Sign In</span>
                <div id="btnSpinner" class="spinner"></div>
                <!-- Inline SVG: Login Arrow -->
                <svg id="btnIcon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
        </form>

        <div class="security-badge">
            <!-- Inline SVG: Shield -->
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            <span>Protected by Firebase Authentication</span>
        </div>
    </div>

    <!-- Firebase Modular SDK Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
            authDomain: "ghotimarket.firebaseapp.com",
            databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
            projectId: "ghotimarket",
            storageBucket: "ghotimarket.firebasestorage.app",
            messagingSenderId: "481257644093",
            appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
            measurementId: "G-4SR8V2EKC1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnIcon = document.getElementById('btnIcon');
        const alertBox = document.getElementById('alertBox');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        // Owner Authorization Checker
        function isOwner(user) {
            return user && (
                user.email === "support@ghotimarket.com" || 
                user.email === "nazrulislam887441234@gmail.com"
            );
        }

        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            alertBox.textContent = '';
            alertBox.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.style.display = 'none';
                btnIcon.style.display = 'none';
                btnSpinner.style.display = 'block';
            } else {
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnIcon.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        }

        // Password Visibility Toggle with Inline SVGs
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            if (type === 'text') {
                eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>';
            } else {
                eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        });

        // Persistent Session Check with Role Validation
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    if (isOwner(user)) {
                        window.location.replace("/dashboard");
                        return;
                    }

                    const adminRef = doc(db, "admins", user.email);
                    const adminSnap = await getDoc(adminRef);
                    const adminData = adminSnap.exists() ? adminSnap.data() : null;

                    const isValidAdmin = adminSnap.exists() && 
                        adminData.email === user.email && 
                        adminData.uid === user.uid && 
                        adminData.role === "admin" && 
                        adminData.active === true;

                    if (isValidAdmin) {
                        window.location.replace("/dashboard");
                    } else {
                        await signOut(auth);
                    }
                } catch (err) {
                    await signOut(auth);
                }
            }
        });

        // Authentication Submission Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert("ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।");
                return;
            }

            setLoading(true);

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                if (isOwner(user)) {
                    window.location.replace("/dashboard");
                    return;
                }

                const adminRef = doc(db, "admins", user.email);
                const adminSnap = await getDoc(adminRef);
                const adminData = adminSnap.exists() ? adminSnap.data() : null;

                const isValidAdmin = adminSnap.exists() && 
                    adminData.email === user.email && 
                    adminData.uid === user.uid && 
                    adminData.role === "admin" && 
                    adminData.active === true;

                if (isValidAdmin) {
                    window.location.replace("/dashboard");
                } else {
                    await signOut(auth);

                    if (!adminSnap.exists()) {
                        showAlert("আপনার Admin Account অনুমোদিত নয়।");
                    } else if (adminData.active !== true) {
                        showAlert("আপনার Admin Account বর্তমানে নিষ্ক্রিয়।");
                    } else if (adminData.uid !== user.uid) {
                        showAlert("Admin Account verification failed।");
                    } else {
                        showAlert("আপনার Admin Account সক্রিয় নয় অথবা Admin তথ্য সঠিক নয়।");
                    }
                    setLoading(false);
                }

            } catch (error) {
                await signOut(auth).catch(() => {});
                
                switch (error.code) {
                    case 'auth/invalid-credential':
                    case 'auth/wrong-password':
                    case 'auth/user-not-found':
                    case 'auth/invalid-email':
                        showAlert("ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।");
                        break;
                    case 'auth/too-many-requests':
                        showAlert("অতিরিক্ত ভুল চেষ্টার কারণে একাউন্ট সাময়িক লক করা হয়েছে। পরে চেষ্টা করুন।");
                        break;
                    case 'auth/network-request-failed':
                        showAlert("নেটওয়ার্ক সমস্যা হয়েছে। আবার চেষ্টা করুন।");
                        break;
                    default:
                        showAlert("লগইন করতে সমস্যা হচ্ছে। কিছুক্ষণ পর আবার চেষ্টা করুন।");
                        break;
                }
                setLoading(false);
            }
        });
    </script>
</body>
</html>
