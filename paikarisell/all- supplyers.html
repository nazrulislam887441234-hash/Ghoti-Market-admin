/* =====================================
   COUNTER HELPER
===================================== */

// Existing counter থেকে সংখ্যা পরিবর্তন করবে।
// কখনো কাউন্টারকে Negative হতে দেবে না।

function changeCount(current,amount){

 return Math.max(0,(Number(current)||0)+amount);

}


// informations/seller ডকুমেন্টের
// কাউন্টার আপডেট করার Helper Function।

function updateSellerCounters(transaction,infoSnap,changes){

 const oldData=infoSnap.exists()?infoSnap.data():{};

 const updatedData={};

 for(const field in changes){

  updatedData[field]=changeCount(
   oldData[field],
   changes[field]
  );

 }

 transaction.set(
  sellerInfoRef,
  updatedData,
  {merge:true}
 );

}


/* =====================================
   LOAD SUPPLIERS
===================================== */

async function loadSuppliers(reset=false){

 if(reset){

  supplierGrid.innerHTML="";
  currentSuppliers=[];
  lastVisibleDoc=null;

  skeletonContainer.classList.remove("hidden");
  emptyState.classList.add("hidden");
  loadMoreContainer.classList.add("hidden");
 }

 try{

  let constraints=[
   orderBy("createdAt","desc"),
   limit(20)
  ];

  if(activeQueryFilters.verified!=="all"){

   constraints.unshift(
    where("verified","==",activeQueryFilters.verified==="true")
   );

  }

  if(activeQueryFilters.active!=="all"){

   constraints.unshift(
    where("active","==",activeQueryFilters.active==="true")
   );

  }

  if(activeQueryFilters.reject!=="all"){

   constraints.unshift(
    where("reject","==",activeQueryFilters.reject==="true")
   );

  }

  if(lastVisibleDoc&&!reset){
   constraints.push(startAfter(lastVisibleDoc));
  }

  const finalQuery=query(supplierCollection,...constraints);

  const snapshot=await getDocs(finalQuery);

  skeletonContainer.classList.add("hidden");

  if(snapshot.empty&&reset){

   emptyState.classList.remove("hidden");
   return;

  }

  lastVisibleDoc=snapshot.docs[snapshot.docs.length-1]||null;

  snapshot.forEach(docSnap=>{

   const supplier={
    id:docSnap.id,
    ...docSnap.data()
   };

   currentSuppliers.push(supplier);
   renderSupplierCard(supplier);

  });

  loadMoreContainer.classList.toggle(
   "hidden",
   snapshot.docs.length<20
  );

 }catch(error){

  console.error("Load error:",error);

  skeletonContainer.classList.add("hidden");

  showToast("সাপ্লায়ার লোড করতে সমস্যা হয়েছে।","error");

 }

}

/* =====================================
   1. VERIFY / UNVERIFY
===================================== */

async function handleVerify(docId,currentVerified,phone){

 const nextVerified=!currentVerified;

 const title=nextVerified?"সাপ্লায়ার ভেরিফিকেশন":"সাপ্লায়ার আনভেরিফিকেশন";

 const description=nextVerified
 ? "আপনি কি এই সাপ্লায়ারকে Verified করতে চান?"
 : "আপনি কি এই সাপ্লায়ারকে Unverified করতে চান?";

 openConfirmModal(title,description,async()=>{

  try{

   const supplierRef=doc(db,"supplyers",docId);

   const normalizedPhone=(phone||"").replace(/[^0-9]/g,"");

   const registrationRef=doc(
    db,
    "registrations",
    normalizedPhone||docId
   );


   await runTransaction(db,async transaction=>{

    // প্রথমে সব ডকুমেন্ট Read করতে হবে।

    const supSnap=await transaction.get(supplierRef);
    const infoSnap=await transaction.get(sellerInfoRef);

    if(!supSnap.exists()){
     throw new Error("Supplier does not exist!");
    }

    const supData=supSnap.data();

    const actualVerified=supData.verified===true;

    if(actualVerified===nextVerified){
     throw new Error("এই সাপ্লায়ারের Verification Status ইতিমধ্যে পরিবর্তিত হয়েছে।");
    }


    // Verified হলে:
    // verifiedSeller +1
    // unverified -1

    // Unverified হলে:
    // verifiedSeller -1
    // unverified +1

    const changes=nextVerified
    ?{
      verifiedSeller:+1,
      unverified:-1
     }
    :{
      verifiedSeller:-1,
      unverified:+1
     };


    transaction.update(supplierRef,{
     verified:nextVerified
    });


    updateSellerCounters(
     transaction,
     infoSnap,
     changes
    );


    // আগের Registration Logic শুধু Verify করার সময়।

    if(nextVerified){

     transaction.set(
      registrationRef,
      {used:true},
      {merge:true}
     );

    }

   });


   showToast(
    nextVerified
    ?"সাপ্লায়ার Verified হয়েছে এবং কাউন্টার আপডেট হয়েছে।"
    :"সাপ্লায়ার Unverified হয়েছে এবং কাউন্টার আপডেট হয়েছে।"
   );

   loadSuppliers(true);

  }catch(error){

   console.error("Verification error:",error);

   showToast(
    error.message||"Verification আপডেট করা যায়নি।",
    "error"
   );

  }

 });

}


/* =====================================
   2. ACTIVE / INACTIVE
===================================== */

async function handleToggleActive(docId,currentActive){

 const nextActive=!currentActive;

 openConfirmModal(
  "স্ট্যাটাস পরিবর্তন",
  `আপনি কি এই সাপ্লায়ারকে ${nextActive?"Active":"Inactive"} করতে চান?`,
  async()=>{

   try{

    const supplierRef=doc(db,"supplyers",docId);

    await runTransaction(db,async transaction=>{

     const supSnap=await transaction.get(supplierRef);
     const infoSnap=await transaction.get(sellerInfoRef);

     if(!supSnap.exists()){
      throw new Error("Supplier not found!");
     }

     const actualActive=supSnap.data().active===true;

     if(actualActive===nextActive){
      throw new Error("Status ইতিমধ্যে পরিবর্তিত হয়েছে।");
     }


     // Active করলে:
     // active +1, inactive -1

     // Inactive করলে:
     // active -1, inactive +1

     const changes=nextActive
     ?{
       active:+1,
       inactive:-1
      }
     :{
       active:-1,
       inactive:+1
      };


     transaction.update(supplierRef,{
      active:nextActive
     });


     updateSellerCounters(
      transaction,
      infoSnap,
      changes
     );

    });


    showToast(
     "Status এবং Informations Counter সফলভাবে আপডেট হয়েছে।"
    );

    loadSuppliers(true);

   }catch(error){

    console.error("Active update error:",error);

    showToast(
     error.message||"Status পরিবর্তন করা যায়নি।",
     "error"
    );

   }

  }
 );

}


/* =====================================

/* =====================================
   4. DELETE SUPPLIER
===================================== */

async function handleDeleteSupplier(docId,supName){

 openConfirmModal(
  "সাপ্লায়ার ডিলিট",
  `"${supName||"এই সাপ্লায়ার"}" অ্যাকাউন্টটি ডিলিট করতে চান? এই কাজটি পূর্বাবস্থায় ফেরানো যাবে না।`,
  async()=>{

   try{

    const supplierRef=doc(db,"supplyers",docId);


    await runTransaction(db,async transaction=>{

     // Read both documents first

     const supSnap=await transaction.get(supplierRef);
     const infoSnap=await transaction.get(sellerInfoRef);

     if(!supSnap.exists()){
      throw new Error("Supplier already deleted!");
     }

     const data=supSnap.data();


     // Supplier Verified থাকলে:
     // verifiedSeller -1

     // Supplier Unverified থাকলে:
     // unverified -1

     // Supplier Active থাকলে:
     // active -1

     // Supplier Inactive থাকলে:
     // inactive -1

     const changes={};


     if(data.verified===true){

      changes.verifiedSeller=-1;

     }else{

      changes.unverified=-1;

     }


     if(data.active===true){

      changes.active=-1;

     }else{

      changes.inactive=-1;

     }


     // Update informations/seller

     updateSellerCounters(
      transaction,
      infoSnap,
      changes
     );


     // Delete supplier document

     transaction.delete(supplierRef);

    });


    showToast(
     "সাপ্লায়ার ডিলিট হয়েছে এবং সব কাউন্টার আপডেট হয়েছে।"
    );

    loadSuppliers(true);

   }catch(error){

    console.error("Delete error:",error);

    showToast(
     error.message||"সাপ্লায়ার ডিলিট করা যায়নি।",
     "error"
    );

   }

  }
 );

}


/* =====================================
   LIVE SUBSCRIPTION COUNTDOWN
===================================== */

function startSharedCountdownTimer(){

 if(sharedTimerInterval){
  clearInterval(sharedTimerInterval);
 }

 sharedTimerInterval=setInterval(()=>{

  const elements=document.querySelectorAll(".countdown-text");

  const now=Date.now();

  elements.forEach(el=>{

   const expiry=parseInt(el.dataset.expiry||"0",10);

   if(!expiry){
    el.innerText="সাবস্ক্রিপশন চালু নেই";
    return;
   }

   const diff=expiry-now;

   if(diff<=0){
    el.innerText="মেয়াদ শেষ";
    return;
   }

   const days=Math.floor(diff/86400000);
   const hours=Math.floor(diff%86400000/3600000);
   const minutes=Math.floor(diff%3600000/60000);
   const seconds=Math.floor(diff%60000/1000);

   el.innerText=
   `${days} দিন : ${hours} ঘণ্টা : ${minutes} মি : ${seconds} সে`;

  });

 },1000);

}


/* =====================================
   SEARCH
===================================== */

$("searchInput").addEventListener("input",event=>{

 clearTimeout(searchDebounceTimer);

 const value=event.target.value.trim();

 searchDebounceTimer=setTimeout(async()=>{

  if(!value){

   loadSuppliers(true);
   return;

  }

  supplierGrid.innerHTML="";
  currentSuppliers=[];
  emptyState.classList.add("hidden");
  skeletonContainer.classList.remove("hidden");
  loadMoreContainer.classList.add("hidden");


  try{

   // UID Search

   if(value.length>=20&&!value.includes("@")){

    const snap=await getDoc(
     doc(db,"supplyers",value)
    );

    skeletonContainer.classList.add("hidden");

    if(snap.exists()){

     const supplier={
      id:snap.id,
      ...snap.data()
     };

     currentSuppliers=[supplier];
     renderSupplierCard(supplier);

    }else{

     emptyState.classList.remove("hidden");

    }

    return;

   }


   // Email Prefix Search

   const emailQuery=query(
    supplierCollection,
    where("email",">=",value.toLowerCase()),
    where("email","<=",value.toLowerCase()+"\uf8ff"),
    limit(20)
   );

   const snapshot=await getDocs(emailQuery);

   skeletonContainer.classList.add("hidden");

   if(snapshot.empty){

    emptyState.classList.remove("hidden");
    return;

   }

   snapshot.forEach(docSnap=>{

    const supplier={
     id:docSnap.id,
     ...docSnap.data()
    };

    currentSuppliers.push(supplier);
    renderSupplierCard(supplier);

   });

  }catch(error){

   console.error(error);

   skeletonContainer.classList.add("hidden");

   showToast("সার্চ করতে সমস্যা হয়েছে।","error");

  }

 },500);

});

/* =====================================
   CONFIRM MODAL
===================================== */

function openConfirmModal(title,description,callback){

 $("modalTitle").innerText=title;
 $("modalDesc").innerText=description;

 modalConfirmCallback=callback;

 confirmModal.classList.remove("hidden");

}


$("modalCancelBtn").addEventListener("click",()=>{

 confirmModal.classList.add("hidden");
 modalConfirmCallback=null;

});


$("modalConfirmBtn").addEventListener("click",async()=>{

 if(!modalConfirmCallback)return;

 const callback=modalConfirmCallback;

 modalConfirmCallback=null;

 $("modalConfirmBtn").disabled=true;
 $("modalConfirmBtn").innerText="অপেক্ষা করুন...";

 try{

  await callback();

 }finally{

  confirmModal.classList.add("hidden");

  $("modalConfirmBtn").disabled=false;
  $("modalConfirmBtn").innerText="নিশ্চিত করুন";

 }

});
