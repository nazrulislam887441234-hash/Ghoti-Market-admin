/* =====================================
   TOAST NOTIFICATION
===================================== */

function showToast(message,type="success"){
 const toast=document.createElement("div");
 toast.className=
 `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-white text-sm ${
 type==="success"?"bg-emerald-600":"bg-red-600"
 }`;
 toast.textContent=message;
 $("toastContainer").appendChild(toast);
 setTimeout(()=>toast.remove(),3500);
}


/* =====================================
   AUTHENTICATION
===================================== */

onAuthStateChanged(auth,async user=>{
 if(!user){
  window.location.href="/login";
  return;
 }

 try{
  const email=(user.email||"").toLowerCase().trim();
  const isOwner=OWNER_EMAILS.includes(email);
  let isAdmin=false;

  if(!isOwner){
   const adminRef=doc(db,"admins",user.uid);
   const adminSnap=await getDoc(adminRef);
   if(adminSnap.exists()){
    const data=adminSnap.data();
    if(data.uid===user.uid && data.active===true){
     isAdmin=true;
    }
   }
  }

  if(isOwner||isAdmin){
   authGuardScreen.classList.add("hidden");
   dashboardLayout.classList.remove("hidden");
   dashboardLayout.classList.add("flex");
   $("currentUserRoleText").innerText=isOwner?"Owner":"Admin";
   initDashboard();
  }else{
   $("authStatusTitle").innerText="Access Denied";
   $("authStatusDesc").innerText="আপনার এই প্যানেল ব্যবহারের অনুমতি নেই।";

   $("accessDeniedActions").classList.remove("hidden");

 }catch(error){

  $("authStatusTitle").innerText="ত্রুটি সংঘটিত হয়েছে";
  $("authStatusDesc").innerText="অনুমোদন যাচাই করা সম্ভব হয়নি।";
  $("authSpinner").classList.add("hidden");
 }
});

   DASHBOARD INITIALIZATION
===================================== */

function initDashboard(){
 loadSuppliers(true);
 startSharedCountdownTimer();
}


/* =====================================
   COUNTER HELPER
===================================== */

function changeCount(current,amount){
 return Math.max(0,(Number(current)||0)+amount);
}

function updateSellerCounters(transaction,infoSnap,changes){
 const oldData=infoSnap.exists()?infoSnap.data():{};
 const updatedData={};
 for(const field in changes){
  updatedData[field]=changeCount(
   oldData[field],
   changes[field]
  );
 }
 transaction.set(
  sellerInfoRef,
  updatedData,
  {merge:true}
 );
}


/* =====================================
   LOAD SUPPLIERS
===================================== */

async function loadSuppliers(reset=false){
 if(reset){
  supplierGrid.innerHTML="";
  currentSuppliers=[];
  lastVisibleDoc=null;

  skeletonContainer.classList.remove("hidden");
  emptyState.classList.add("hidden");
  loadMoreContainer.classList.add("hidden");
 }

 try{
  let constraints=[
   orderBy("createdAt","desc"),
   limit(20)
  ];

  if(activeQueryFilters.verified!=="all"){
   constraints.unshift(
    where("verified","==",activeQueryFilters.verified==="true")
   );
  }

  if(activeQueryFilters.active!=="all"){
   constraints.unshift(
    where("active","==",activeQueryFilters.active==="true")
   );
  }

  if(activeQueryFilters.reject!=="all"){
   constraints.unshift(
    where("reject","==",activeQueryFilters.reject==="true")
   );
  }

  if(lastVisibleDoc&&!reset){
   constraints.push(startAfter(lastVisibleDoc));
  }

  const finalQuery=query(supplierCollection,...constraints);
  const snapshot=await getDocs(finalQuery);

  skeletonContainer.classList.add("hidden");

  if(snapshot.empty&&reset){
   emptyState.classList.remove("hidden");
   return;
  }

  lastVisibleDoc=snapshot.docs[snapshot.docs.length-1]||null;

  snapshot.forEach(docSnap=>{
   const supplier={
    id:docSnap.id,
    ...docSnap.data()
   };
   currentSuppliers.push(supplier);
   renderSupplierCard(supplier);
  });

  loadMoreContainer.classList.toggle(
   "hidden",
   snapshot.docs.length<20
  );

 }catch(error){
  console.error("Load error:",error);
  skeletonContainer.classList.add("hidden");
  showToast("সাপ্লায়ার লোড করতে সমস্যা হয়েছে।","error");
 }

}

   <div>
    <p class="text-xs text-gray-500">মোট প্রোডাক্ট</p>
    <b>${Number(sup.product)||0}</b>
   </div>
   <div>
    <p class="text-xs text-gray-500">অ্যাক্টিভ প্রোডাক্ট</p>

   </div>
  </div>

  <div class="space-y-2 text-xs text-gray-600 mb-4">
   <p class="break-all">Email: ${safe(sup.email||"নেই")}</p>
   <p>Phone: ${safe(sup.phone||"নেই")}</p>
   <p>WhatsApp: ${safe(sup.whatsApp||sup.phone||"নেই")}</p>
  </div>

  <div class="bg-gray-50 p-3 rounded-xl text-xs text-gray-500 mb-4">
   ${safe(sup.description||"কোনো বিবরণ দেওয়া হয়নি।")}
  </div>

  <!-- NOTE SECTION -->
  <div class="mb-4">
   <label class="block text-xs text-gray-500 mb-1 font-semibold">নোট (Note)</label>

   note:noteText

  console.error(error);
  showToast("নোট সেভ করা যায়নি।","error");
 }
}


/* =====================================
   1. VERIFY (ONLY VERIFY, NO UNVERIFY)
===================================== */

async function handleVerify(docId,currentVerified,phone){
 if(currentVerified){
  showToast("আনভেরিফাইড করা নিষিদ্ধ!","error");
  return;
 }

 openConfirmModal(
  "সাপ্লায়ার ভেরিফিকেশন",
  "আপনি কি এই সাপ্লায়ারকে Verified করতে চান?",
  async()=>{
   try{
    const supplierRef=doc(db,"supplyers",docId);
    const normalizedPhone=(phone||"").replace(/[^0-9]/g,"");
    const registrationRef=doc(db,"registrations",normalizedPhone||docId);

    await runTransaction(db,async transaction=>{
     const supSnap=await transaction.get(supplierRef);
     const infoSnap=await transaction.get(sellerInfoRef);

     if(!supSnap.exists()){
      throw new Error("Supplier does not exist!");
     }
     const supData=supSnap.data();
     if(supData.verified===true){
      throw new Error("এই সাপ্লায়ার ইতিমধ্যে Verified.");
     }

     const changes={
      verifiedSeller:+1,
      unverified:-1
     };

     transaction.update(supplierRef,{
      verified:true
     });

     updateSellerCounters(transaction,infoSnap,changes);

     transaction.set(
      registrationRef,
      {used:true},
      {merge:true}
     );
    });

    showToast("সাপ্লায়ার Verified হয়েছে এবং কাউন্টার আপডেট হয়েছে।");
    loadSuppliers(true);
   }catch(error){
    console.error("Verification error:",error);
    showToast(error.message||"Verification আপডেট করা যায়নি।","error");
   }
  }
 );
}


/* =====================================
   2 & 3. ACTIVE / INACTIVE WITH ALREADYACTIVE LOGIC
===================================== */

async function handleToggleActive(docId,currentActive){
 const nextActive=!currentActive;
 const actionTitle=nextActive?"Active":"Inactive";

 openConfirmModal(
  "স্ট্যাটাস পরিবর্তন",
  `আপনি কি এই সাপ্লায়ারকে ${actionTitle} করতে চান?`,
  async()=>{
   try{
    const supplierRef=doc(db,"supplyers",docId);

    await runTransaction(db,async transaction=>{
     const supSnap=await transaction.get(supplierRef);
     const infoSnap=await transaction.get(sellerInfoRef);

     if(!supSnap.exists()){
      throw new Error("Supplier not found!");
     }

     const supData=supSnap.data();
     const actualActive=supData.active===true;

     if(actualActive===nextActive){
      throw new Error("Status ইতিমধ্যে পরিবর্তিত হয়েছে।");
     }

     const alreadyActive=supData.alreadyActive===true;
     const changes={};
     const updatePayload={active:nextActive};

     if(nextActive){
      // Activating
      changes.active=(changes.active||0)+1;
      if(actualActive===false){
       changes.inactive=(changes.inactive||0)-1;
      }
      if(!alreadyActive){
       updatePayload.alreadyActive=true;
      }
     }else{
      // Inactivating
      if(alreadyActive){
       changes.active=(changes.active||0)-1;
       changes.inactive=(changes.inactive||0)+1;
      }else{
       // alreadyActive নেই -> শুধুমাত্র inactive থেকে ১ কমবে
       changes.inactive=(changes.inactive||0)-1;
      }
     }

     transaction.update(supplierRef,updatePayload);
     updateSellerCounters(transaction,infoSnap,changes);
    });

    showToast("Status এবং কাউন্টার সফলভাবে আপডেট হয়েছে।");
    loadSuppliers(true);
   }catch(error){
    console.error("Active update error:",error);
    showToast(error.message||"Status পরিবর্তন করা যায়নি।","error");
   }
  }
 );
}


/* =====================================
   REJECT / UNREJECT
===================================== */

async function handleToggleReject(docId,currentReject){

 openConfirmModal(

    showToast("Reject Status পরিবর্তন করা যায়নি।","error");
   }
  }
 );
}


/* =====================================
   LIVE SUBSCRIPTION COUNTDOWN
===================================== */

function startSharedCountdownTimer(){
 if(sharedTimerInterval){
  clearInterval(sharedTimerInterval);
 }

 sharedTimerInterval=setInterval(()=>{
  const elements=document.querySelectorAll(".countdown-text");
  const now=Date.now();

  elements.forEach(el=>{
   const expiry=parseInt(el.dataset.expiry||"0",10);
   if(!expiry){
    el.innerText="সাবস্ক্রিপশন চালু নেই";
    return;
   }

   const diff=expiry-now;
   if(diff<=0){
    el.innerText="মেয়াদ শেষ";
    return;
   }

   const days=Math.floor(diff/86400000);
   const hours=Math.floor(diff%86400000/3600000);
   const minutes=Math.floor(diff%3600000/60000);
   const seconds=Math.floor(diff%60000/1000);

   el.innerText=`${days} দিন : ${hours} ঘণ্টা : ${minutes} মি : ${seconds} সে`;
  });
 },1000);
}


/* =====================================
   7. SMART SEARCH (Phone, Email, UID)
===================================== */

$("searchInput").addEventListener("input",event=>{
 clearTimeout(searchDebounceTimer);
 const value=event.target.value.trim();
 const searchType=$("searchTypeSelect").value;

 searchDebounceTimer=setTimeout(async()=>{
  if(!value){
   loadSuppliers(true);
   return;
  }

  supplierGrid.innerHTML="";
  currentSuppliers=[];
  emptyState.classList.add("hidden");
  skeletonContainer.classList.remove("hidden");
  loadMoreContainer.classList.add("hidden");

  try{
   let finalQuery=null;

   if(searchType==="uid"){
    const snap=await getDoc(doc(db,"supplyers",value));
    skeletonContainer.classList.add("hidden");
    if(snap.exists()){
     const supplier={id:snap.id,...snap.data()};
     currentSuppliers=[supplier];
     renderSupplierCard(supplier);
    }else{
     emptyState.classList.remove("hidden");
    }
    return;
   }else if(searchType==="phone"){
    finalQuery=query(
     supplierCollection,
     where("phone",">=",value),
     where("phone","<=",value+"\uf8ff"),
     limit(20)
    );
   }else if(searchType==="email"){
    finalQuery=query(
     supplierCollection,
     where("email",">=",value.toLowerCase()),
     where("email","<=",value.toLowerCase()+"\uf8ff"),
     limit(20)
    );
   }

   if(finalQuery){
    const snapshot=await getDocs(finalQuery);
    skeletonContainer.classList.add("hidden");
    if(snapshot.empty){
     emptyState.classList.remove("hidden");
     return;
    }
    snapshot.forEach(docSnap=>{
     const supplier={id:docSnap.id,...docSnap.data()};
     currentSuppliers.push(supplier);
     renderSupplierCard(supplier);
    });
   }
  }catch(error){
   console.error(error);
   skeletonContainer.classList.add("hidden");
   showToast("সার্চ করতে সমস্যা হয়েছে।","error");
  }
 },500);
});

/* =====================================
   CONFIRM MODAL
===================================== */

function openConfirmModal(title,description,callback){
 $("modalTitle").innerText=title;
 $("modalDesc").innerText=description;
 modalConfirmCallback=callback;
 confirmModal.classList.remove("hidden");
}

$("modalCancelBtn").addEventListener("click",()=>{
 confirmModal.classList.add("hidden");
 modalConfirmCallback=null;
});

$("modalConfirmBtn").addEventListener("click",async()=>{
 if(!modalConfirmCallback)return;
 const callback=modalConfirmCallback;
 modalConfirmCallback=null;

 $("modalConfirmBtn").disabled=true;
 $("modalConfirmBtn").innerText="অপেক্ষা করুন...";

 try{
  await callback();
 }finally{
  confirmModal.classList.add("hidden");
  $("modalConfirmBtn").disabled=false;
  $("modalConfirmBtn").innerText="নিশ্চিত করুন";
 }
});
