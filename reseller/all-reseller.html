<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সকল রিসেলার ম্যানেজমেন্ট | PAIKARI SELL</title>
    <link rel="icon" type="image/png" href="https://paikarisell.ghotimarket.com/photo/favicon.png">
    <link rel="stylesheet" href="all-reseller.css">
</head>
<body>

    <!-- Header Section -->
    <header class="admin-header">
        <div class="header-container">
            <div class="brand-box">
                <img src="https://paikarisell.ghotimarket.com/photo/logo.png" alt="PAIKARI SELL Logo" class="brand-logo">
                <h1 class="brand-title">সকল রিসেলার ম্যানেজমেন্ট</h1>
            </div>
            <div class="header-actions">
                <button type="button" id="refreshBtn" class="btn btn-outline" title="রিফ্রেশ করুন">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    <span>রিফ্রেশ</span>
                </button>
                <button type="button" id="dashboardBtn" class="btn btn-primary">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>ড্যাশবোর্ড</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">
        
        <!-- Search & Filter Control Panel -->
        <section class="controls-section">
            <div class="search-wrapper">
                <div class="search-type-box">
                    <select id="searchTypeSelect" class="form-select">
                        <option value="phone">ফোন নাম্বার</option>
                        <option value="email">ইমেইল</option>
                        <option value="uid">UID</option>
                    </select>
                </div>
                <div class="search-input-box">
                    <svg class="icon search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="searchInput" class="form-input" placeholder="১১ ডিজিটের ফোন নাম্বার দিন...">
                    <button type="button" id="clearSearchBtn" class="clear-search-btn" style="display: none;">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
                <button type="button" id="searchSubmitBtn" class="btn btn-primary">খুঁজুন</button>
            </div>

            <!-- Filter Navigation Tabs -->
            <div class="filter-tabs" id="filterTabs">
                <button type="button" class="filter-tab active" data-filter="all">সকল রিসেলার</button>
                <button type="button" class="filter-tab" data-filter="verified">ভেরিফাইড</button>
                <button type="button" class="filter-tab" data-filter="unverified">ভেরিফাইড নয়</button>
                <button type="button" class="filter-tab" data-filter="active">এক্টিভ</button>
                <button type="button" class="filter-tab" data-filter="inactive">ইনেক্টিভ</button>
                <button type="button" class="filter-tab" data-filter="rejected">রিজেক্ট করা</button>
            </div>
        </section>

        <!-- Reseller Grid Container -->
        <section class="reseller-section">
            <div id="resellerContainer" class="reseller-grid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <svg class="empty-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                <h3>কোনো রিসেলার পাওয়া যায়নি</h3>
                <p>বর্তমান ফিল্টার বা অনুসন্ধানের সাথে মিল রয়েছে এমন কোনো রিসেলার ডাটাবেজে নেই।</p>
            </div>

            <!-- Load More Pagination Button -->
            <div class="load-more-box" id="loadMoreBox" style="display: none;">
                <button type="button" id="loadMoreBtn" class="btn btn-outline-primary">আরও দেখুন</button>
            </div>
        </section>
    </main>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="custom-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <svg class="modal-warning-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                    <h3 id="modalTitle">নিশ্চিত করুন</h3>
                </div>
            </div>
            <div class="modal-body">
                <p id="modalMessage">আপনি কি এই কাজটি সম্পন্ন করতে চান?</p>
            </div>
            <div class="modal-footer">
                <button type="button" id="modalCancelBtn" class="btn btn-secondary">বাতিল</button>
                <button type="button" id="modalConfirmBtn" class="btn btn-primary">নিশ্চিত করুন</button>
            </div>
        </div>
    </div>

    <!-- Edit Reseller Modal -->
    <div id="editModal" class="custom-modal" style="display: none;">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>রিসেলার তথ্য এডিট করুন</h3>
                <button type="button" id="editModalCloseBtn" class="modal-close-btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="editResellerForm">
                    <input type="hidden" id="editDocId">
                    <div class="form-group">
                        <label>নাম (Name) *</label>
                        <input type="text" id="editName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>ফোন নাম্বার (Phone) *</label>
                        <input type="text" id="editPhone" class="form-input" maxlength="11" required>
                    </div>
                    <div class="form-group">
                        <label>হোয়াটসঅ্যাপ নাম্বার (WhatsApp) *</label>
                        <input type="text" id="editWhatsApp" class="form-input" maxlength="11" required>
                    </div>
                    <div class="form-row-readonly">
                        <div class="readonly-item"><span>UID:</span> <span id="viewUid">-</span></div>
                        <div class="readonly-item"><span>Email:</span> <span id="viewEmail">-</span></div>
                        <div class="readonly-item"><span>Balance:</span> <span id="viewBalance">0</span></div>
                        <div class="readonly-item"><span>Verified:</span> <span id="viewVerified">-</span></div>
                        <div class="readonly-item"><span>Active:</span> <span id="viewActive">-</span></div>
                        <div class="readonly-item"><span>Reject:</span> <span id="viewReject">-</span></div>
                    </div>
                    <div class="modal-footer-actions">
                        <button type="button" id="editCancelBtn" class="btn btn-secondary">বাতিল</button>
                        <button type="submit" id="editSaveBtn" class="btn btn-primary">পরিবর্তন সংরক্ষণ করুন</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Firebase SDKs & Script -->
    <script type="module" src="all-reseller.js"></script>
</body>
</html>
