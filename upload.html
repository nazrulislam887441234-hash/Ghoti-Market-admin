<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Product Upload - Ghoti Market</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
    --primary: #FF6B00;
    --accent: #FF8C00;
    --danger: #ef4444;
    --success: #22c55e;
    --bg1: #FFF7ED;
    --bg2: #FFEDD5;
    --text: #1f2937;
    --muted: #6b7280;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;}
body{min-height:100vh;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);padding:20px;color:var(--text);}
.card{max-width:850px;margin:20px auto;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);padding:35px;border-radius:25px;border:1px solid rgba(255,107,0,.1);box-shadow:0 20px 60px rgba(255,107,0,.15);}
h2{text-align:center;font-family:'Poppins';margin-bottom:25px;font-size:28px;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
label{font-weight:600;margin-top:18px;display:block;color:var(--muted);font-size:14px;}
input,select,textarea{width:100%;padding:14px;margin-top:8px;border-radius:12px;border:2px solid #fed7aa;background:#fff;color:var(--text);font-size:16px;transition:.3s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(255,107,0,.1);}
textarea{min-height:120px;resize:vertical;}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.upload-box{border:2px dashed var(--primary);border-radius:15px;padding:25px;text-align:center;cursor:pointer;background:rgba(255,107,0,.05);margin-top:10px;transition:.3s;}
.upload-box:hover{background:rgba(255,107,0,.1);}
.upload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:15px;}
.img-wrap{position:relative;}
.preview-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:2px solid var(--accent);}
.img-wrap .remove{position:absolute;top:-8px;right:-8px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-weight:700;font-size:16px;}
.keyword-box{display:flex;gap:10px;margin-top:8px;}
.btn-add{padding:14px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:.3s;white-space:nowrap;}
.btn-add:hover{background:var(--accent);}
.keyword-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.keyword-tag{background:rgba(255,107,0,.15);padding:6px 12px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:5px;color:var(--primary);font-weight:600;}
.keyword-tag span{cursor:pointer;color:var(--danger);font-weight:700;}

/* Affiliate Section */
.affiliate-box{background:rgba(255,107,0,.05);padding:18px;border-radius:15px;border:1px solid #fed7aa;margin-top:20px;}
.radio-group{display:flex;gap:20px;margin-top:8px;}
.radio-group label{margin-top:0;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;color:var(--text);}

/* Variant Section */
.variant-section{background:#fff;border:2px solid #fed7aa;padding:20px;border-radius:15px;margin-top:20px;}
.variant-item{background:var(--bg1);padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid #fed7aa;}
.variant-header{display:flex;gap:10px;align-items:center;}
.values-container{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.value-row{display:grid;grid-template-columns:1fr 120px 40px;gap:10px;align-items:center;}
.btn-danger{background:var(--danger);color:#fff;border:none;border-radius:8px;padding:12px;cursor:pointer;font-weight:700;}
.btn-danger:hover{opacity:.85;}

#uploadBtn{background:#d1d5db;cursor:not-allowed;width:100%;padding:16px;margin-top:25px;color:#fff;font-weight:700;font-size:17px;border:none;border-radius:12px;transition:.3s;}
#uploadBtn.active{background:linear-gradient(90deg,var(--primary),var(--accent));cursor:pointer;}
#uploadBtn.active:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,107,0,.3);}
.top-bar{display:flex;justify-content:space-between;margin-bottom:20px;}
.top-bar a{color:var(--primary);font-weight:700;text-decoration:none;}
#status{text-align:center;margin-top:15px;font-weight:600;font-size:15px;}
.warning{background:rgba(255,107,0,.1);border-left:4px solid var(--primary);padding:12px;border-radius:8px;margin-bottom:20px;font-size:14px;}

/* Shop Search */
.search-shop{border:2px solid var(--primary);}
.shop-list{max-height:200px;overflow-y:auto;border:2px solid var(--primary);margin-top:8px;border-radius:12px;display:none;background:#fff;position:absolute;width:calc(100% - 70px);z-index:100;box-shadow:0 10px 25px rgba(0,0,0,0.1);}
.shop-item{padding:12px;cursor:pointer;border-bottom:1px solid #ffedd5;transition:.2s;}
.shop-item:hover{background:rgba(255,107,0,.1);}
.shop-item:last-child{border-bottom:none;}
.selected-shop-box{background:rgba(34,197,94,.1);padding:12px;border-radius:10px;margin-top:10px;border:1px solid var(--success);display:none;}
.shop-search-wrapper{position:relative;}

/* Custom Modal Popup */
.custom-modal {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:all 0.3s ease;}
.custom-modal.show {opacity:1;pointer-events:auto;}
.modal-content {background:#fff;padding:30px;border-radius:20px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2);transform:scale(0.9);transition:all 0.3s ease;}
.custom-modal.show .modal-content {transform:scale(1);}
.modal-icon {font-size:50px;margin-bottom:15px;}
.modal-icon.success {color:var(--success);}
.modal-icon.error {color:var(--danger);}
.modal-title {font-size:20px;font-weight:700;margin-bottom:10px;color:var(--text);}
.modal-text {font-size:15px;color:var(--muted);margin-bottom:20px;}
.modal-btn {background:var(--primary);color:#fff;border:none;padding:12px 25px;border-radius:10px;font-weight:700;cursor:pointer;font-size:16px;}
.modal-btn:hover {background:var(--accent);}
</style>
</head>
<body>

<div class="card" id="mainContent" style="display:none;">
<div class="top-bar">
    <a href="dashboard.html"><i class="fas fa-arrow-left"></i> Dashboard</a>
    <span id="logout" style="color:var(--danger);cursor:pointer;font-weight:700;"><i class="fas fa-sign-out-alt"></i> Logout</span>
</div>

<h2><i class="fas fa-cloud-upload-alt"></i> Admin Product Upload</h2>

<div class="warning"><i class="fas fa-info-circle"></i> Admin হিসেবে আপনি যেকোনো Seller এর হয়ে Unlimited Product Upload করতে পারবেন (দৈনিক ৫টি লিমিট প্রযোজ্য নয়)।</div>

<form id="productForm">
    
    <label><i class="fas fa-store"></i> শপ Search করে Select করুন *</label>
    <div class="shop-search-wrapper">
        <input type="text" id="shopSearch" class="search-shop" placeholder="শপের নাম লিখুন..." autocomplete="off">
        <div id="shopList" class="shop-list"></div>
    </div>
    <div id="selectedShopBox" class="selected-shop-box">
        <b>Selected Shop:</b> <span id="selectedShopNameText"></span>
    </div>
    <input type="hidden" id="selectedShopId">
    <input type="hidden" id="selectedShopWhatsapp">

    <label><i class="fas fa-tags"></i> Category Select *</label>
    <select id="category" required>
        <option value="">Category লোড হচ্ছে...</option>
    </select>

    <label><i class="fas fa-box"></i> Product Name *</label>
    <input type="text" id="name" placeholder="যেমন: iPhone 15 Pro Max" required>

    <div class="price-grid">
        <div>
            <label><i class="fas fa-tag"></i> আগের দাম (Old Price)</label>
            <input type="number" id="oldPrice" placeholder="খালি রাখলে বর্তমান দাম হবে">
        </div>
        <div>
            <label><i class="fas fa-money-bill"></i> বর্তমান দাম (Current Price) *</label>
            <input type="number" id="currentPrice" placeholder="22000" required>
        </div>
    </div>

    <label><i class="fas fa-align-left"></i> Description *</label>
    <textarea id="description" placeholder="Product এর বিস্তারিত লিখুন..." required></textarea>

    <!-- Affiliate Section -->
    <div class="affiliate-box">
        <label style="margin-top:0;"><i class="fas fa-handshake"></i> Affiliate Program</label>
        <div class="radio-group">
            <label><input type="radio" name="affiliateStatus" value="off" checked id="affOff"> OFF</label>
            <label><input type="radio" name="affiliateStatus" value="on" id="affOn"> ON</label>
        </div>
        <div id="affiliateDiscountWrap" style="display:none; margin-top:15px;">
            <label>Affiliate Discount (৳) *</label>
            <input type="number" id="affiliateDiscount" placeholder="যেমন: ৫০ টাকা কমিশন">
        </div>
    </div>

    <!-- Variants System -->
    <div class="variant-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <label style="margin-top:0; font-size:16px; color:var(--text);"><i class="fas fa-list-alt"></i> Product Variants (ঐচ্ছিক)</label>
            <button type="button" class="btn-add" id="addVariantBtn" style="padding:8px 15px; font-size:14px;"><i class="fas fa-plus"></i> Add Variant</button>
        </div>
        <div id="variantsContainer"></div>
    </div>

    <label style="margin-top:20px;"><i class="fas fa-key"></i> Keywords <small style="color:var(--muted);">সর্বোচ্চ ৫০টি</small></label>
    <div class="keyword-box">
        <input type="text" id="keywordInput" placeholder="keyword লিখে Add চাপুন">
        <button type="button" class="btn-add" id="addKeyword">Add</button>
    </div>
    <div class="keyword-list" id="keywordList"></div>

    <label style="margin-top:20px;"><i class="fas fa-images"></i> Product Images * <small style="color:var(--muted);">সর্বোচ্চ ২টি - Auto 1200x1200 WebP + Compress + Watermark</small></label>
    <div class="upload-box" id="uploadBox">
        <p><b><i class="fas fa-plus"></i> ছবি যোগ করুন</b></p>
        <p style="font-size:12px;color:var(--muted);">একসাথে ২টি পর্যন্ত সিলেক্ট করতে পারবেন</p>
    </div>
    <input type="file" id="image" accept="image/*" multiple style="display:none;">
    <div class="upload-grid" id="previewGrid"></div>

    <button type="submit" id="uploadBtn" disabled>Upload Product</button>
</form>
<div id="status"></div>
</div>

<!-- Custom Popup Modal -->
<div class="custom-modal" id="customModal">
    <div class="modal-content">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-text" id="modalText"></div>
        <button class="modal-btn" id="modalBtn">ঠিক আছে</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
  authDomain: "ghotimarket.firebaseapp.com",
  projectId: "ghotimarket",
  storageBucket: "ghotimarket.firebasestorage.app",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef123456"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const IMGBB_API_KEY = "78b96e02ef49049995a9f46a7d62fcd5";

// Custom Popup Function
function showPopup(title, text, type = 'error') {
    const modal = document.getElementById('customModal');
    const icon = document.getElementById('modalIcon');
    const titleEl = document.getElementById('modalTitle');
    const textEl = document.getElementById('modalText');
    
    titleEl.innerText = title;
    textEl.innerText = text;
    
    if(type === 'success') {
        icon.className = 'modal-icon success fas fa-check-circle';
    } else {
        icon.className = 'modal-icon error fas fa-exclamation-circle';
    }
    
    modal.classList.add('show');
}
document.getElementById('modalBtn').onclick = () => {
    document.getElementById('customModal').classList.remove('show');
};

// 1. Auth Guard - support@ghotimarket.com only
onAuthStateChanged(auth, user => {
    if(user && user.email === "support@ghotimarket.com"){
        document.getElementById('mainContent').style.display = 'block';
        loadShops();
        loadCategories();
    } else {
        window.location.href = "index.html";
    }
});
document.getElementById('logout').onclick = () => signOut(auth);

let allShops = [];
let compressedFiles = [];
let keywords = [];

// 2. Shop Search & Select System (Cached)
async function loadShops(){
    try {
        const snapshot = await getDocs(collection(db, "users"));
        allShops = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()})).filter(u => u.shopName);
    } catch(err) {
        console.error("Shop load error:", err);
    }
}

document.getElementById('shopSearch').onkeyup = (e) => {
    const val = e.target.value.toLowerCase().trim();
    const list = document.getElementById('shopList');
    if(!val){ list.style.display = 'none'; return; }
    const filtered = allShops.filter(s => s.shopName.toLowerCase().includes(val));
    list.innerHTML = filtered.map(s => `<div class="shop-item" onclick="selectShop('${s.id}', '${s.shopName.replace(/'/g, "\\'")}', '${s.whatsapp || ''}')">${s.shopName}</div>`).join('');
    list.style.display = filtered.length ? 'block' : 'none';
};

window.selectShop = (id, name, whatsapp) => {
    document.getElementById('selectedShopId').value = id;
    document.getElementById('selectedShopWhatsapp').value = whatsapp;
    document.getElementById('selectedShopNameText').innerText = name;
    document.getElementById('selectedShopBox').style.display = 'block';
    document.getElementById('shopList').style.display = 'none';
    document.getElementById('shopSearch').value = name;
    checkForm();
};

// Hide shop list on outside click
document.addEventListener('click', (e) => {
    if(!e.target.closest('.shop-search-wrapper')) {
        document.getElementById('shopList').style.display = 'none';
    }
});

// 3. Category Load (Duplicate Bug Fix)
async function loadCategories(){
    const select = document.getElementById('category');
    try {
        const snapshot = await getDocs(collection(db, "categories"));
        const catMap = new Map();
        snapshot.docs.forEach(doc => {
            const data = doc.data();
            const name = data.categoryName || data.name;
            const slug = data.slug;
            if(name && slug && !catMap.has(slug)) {
                catMap.set(slug, { name, slug });
            }
        });
        
        let cats = Array.from(catMap.values());
        cats.sort((a,b) => a.name.localeCompare(b.name));

        select.innerHTML = `<option value="">Category সিলেক্ট করুন</option>`;
        cats.forEach(cat => {
            select.innerHTML += `<option value='${JSON.stringify({name: cat.name, slug: cat.slug})}'>${cat.name}</option>`;
        });
    } catch(err) {
        console.error("Category load error:", err);
        select.innerHTML = `<option value="">Category লোড করতে সমস্যা হয়েছে</option>`;
    }
}

// 4. Affiliate Toggle & Logic
document.querySelectorAll('input[name="affiliateStatus"]').forEach(radio => {
    radio.onchange = (e) => {
        const discountWrap = document.getElementById('affiliateDiscountWrap');
        if(e.target.value === 'on') {
            discountWrap.style.display = 'block';
        } else {
            discountWrap.style.display = 'none';
            document.getElementById('affiliateDiscount').value = '';
        }
    };
});

// 5. Product Variants System
document.getElementById('addVariantBtn').onclick = () => {
    const container = document.getElementById('variantsContainer');
    const variantId = 'variant_' + Date.now();
    
    const div = document.createElement('div');
    div.className = 'variant-item';
    div.id = variantId;
    div.innerHTML = `
        <div class="variant-header">
            <input type="text" placeholder="Variant Name (যেমন: Size বা Color)" class="var-name" style="margin-top:0;" required>
            <button type="button" class="btn-danger" onclick="document.getElementById('${variantId}').remove(); checkForm();" style="padding:14px;"><i class="fas fa-trash"></i></button>
        </div>
        <div class="values-container"></div>
        <button type="button" class="btn-add" onclick="addVariantValue('${variantId}')" style="margin-top:10px; padding:8px 12px; font-size:13px;"><i class="fas fa-plus"></i> Add Value</button>
    `;
    container.appendChild(div);
    addVariantValue(variantId);
    checkForm();
};

window.addVariantValue = (variantId) => {
    const valuesContainer = document.querySelector(`#${variantId} .values-container`);
    const valRow = document.createElement('div');
    valRow.className = 'value-row';
    valRow.innerHTML = `
        <input type="text" placeholder="Value (যেমন: S বা Red)" class="val-name" style="margin-top:0;" required>
        <input type="number" placeholder="Extra Price" class="val-price" style="margin-top:0;" value="0">
        <button type="button" class="btn-danger" onclick="this.parentElement.remove(); checkForm();" style="padding:12px;"><i class="fas fa-times"></i></button>
    `;
    valuesContainer.appendChild(valRow);
    checkForm();
};

// Delegate input listening for variants
document.getElementById('variantsContainer').addEventListener('input', checkForm);

// 6. Keyword System
document.getElementById('addKeyword').onclick = addKeywordFunc;
document.getElementById('keywordInput').onkeypress = (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); addKeywordFunc(); }
};
function addKeywordFunc(){
    const input = document.getElementById('keywordInput');
    const val = input.value.trim().toLowerCase();
    if(val && !keywords.includes(val) && keywords.length < 50){
        keywords.push(val);
        renderKeywords();
        input.value = '';
    } else if(keywords.length >= 50){
        showPopup("সতর্কতা", "সর্বোচ্চ ৫০টি Keyword দেওয়া যাবে");
    }
}
function renderKeywords(){
    document.getElementById('keywordList').innerHTML = keywords.map((k,i) =>
        `<div class="keyword-tag">${k} <span onclick="removeKeyword(${i})">×</span></div>`
    ).join('');
}
window.removeKeyword = (i) => { keywords.splice(i,1); renderKeywords(); };

// 7. Image Upload + WebP Compress + 1200x1200 Square + Watermark
document.getElementById('uploadBox').onclick = () => document.getElementById('image').click();
document.getElementById('image').onchange = async (e) => {
  const files = Array.from(e.target.files).slice(0, 2 - compressedFiles.length);
  if(!files.length) return;
  
  document.getElementById('status').innerText = `ছবি প্রসেস হচ্ছে...`;
  
  for(let file of files){
    if(compressedFiles.length >= 2) break;
    try {
        const processed = await processImageWithWatermark(file);
        compressedFiles.push(processed);
        addPreview(processed);
    } catch(err) {
        console.error("Image processing error:", err);
        showPopup("ত্রুটি", "ছবি প্রসেস করতে সমস্যা হয়েছে। অন্য ছবি চেষ্টা করুন।");
    }
  }
  
  document.getElementById('status').innerText = compressedFiles.length > 0 ? `✅ ${compressedFiles.length}/2 টি ছবি রেডি` : '';
  checkForm();
  e.target.value = '';
};

function addPreview(file){
    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    wrap.innerHTML = `
        <img src="${URL.createObjectURL(file)}" class="preview-img">
        <button type="button" class="remove" onclick="removeNewImage(this, '${file.name}')">×</button>
    `;
    document.getElementById('previewGrid').appendChild(wrap);
}
window.removeNewImage = (btn, name) => {
    compressedFiles = compressedFiles.filter(f => f.name !== name);
    btn.parentElement.remove();
    document.getElementById('status').innerText = compressedFiles.length > 0 ? `✅ ${compressedFiles.length}/2 টি ছবি রেডি` : '';
    checkForm();
};

function processImageWithWatermark(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const size = 1200; // 1200x1200 square standard
        canvas.width = size;
        canvas.height = size;

        // White background for padding square
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, size, size);

        // Center and scale image to fit square maintaining aspect ratio
        let w = img.width;
        let h = img.height;
        let scale = Math.min(size / w, size / h);
        let nw = w * scale;
        let nh = h * scale;
        let nx = (size - nw) / 2;
        let ny = (size - nh) / 2;

        ctx.drawImage(img, nx, ny, nw, nh);

        // Try loading watermark from /watermark.png
        const watermarkImg = new Image();
        watermarkImg.crossOrigin = "anonymous";
        watermarkImg.src = "watermark.png";
        watermarkImg.onload = () => {
            const wmWidth = size * 0.25; // 25% of width
            const wmHeight = (watermarkImg.height / watermarkImg.width) * wmWidth;
            const wmX = size - wmWidth - 30;
            const wmY = size - wmHeight - 30;
            ctx.globalAlpha = 0.6; // transparency
            ctx.drawImage(watermarkImg, wmX, wmY, wmWidth, wmHeight);
            ctx.globalAlpha = 1.0;
            finishCanvasToBlob();
        };
        watermarkImg.onerror = () => {
            // If watermark.png not found, skip cleanly
            finishCanvasToBlob();
        };

        function finishCanvasToBlob() {
            canvas.toBlob((blob) => {
                if(!blob) {
                    reject(new Error("Canvas blob generation failed"));
                    return;
                }
                const newFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".webp", {type: "image/webp", lastModified: Date.now()});
                resolve(newFile);
            }, "image/webp", 0.85);
        }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 8. Unique Slug Generation
function generateSlug(name) {
    const baseSlug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const randomSuffix = Math.random().toString(36).substring(2, 6);
    return `${baseSlug}-${randomSuffix}`;
}

// 9. Form Validation Listener
['name','description','currentPrice','category','affiliateDiscount'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.oninput = checkForm;
});
document.getElementById('category').onchange = checkForm;

function checkForm(){
    const sellerId = document.getElementById('selectedShopId').value;
    const name = document.getElementById('name').value.trim();
    const desc = document.getElementById('description').value.trim();
    const price = document.getElementById('currentPrice').value;
    const cat = document.getElementById('category').value;
    const btn = document.getElementById('uploadBtn');
    
    if(sellerId && compressedFiles.length > 0 && name && desc && price && cat){
        btn.classList.add('active');
        btn.disabled = false;
    } else {
        btn.classList.remove('active');
        btn.disabled = true;
    }
}

// 10. Variant Data Extractor & Validator
function getValidatedVariants() {
    const variantItems = document.querySelectorAll('.variant-item');
    const variants = [];
    
    for(let item of variantItems) {
        const nameInput = item.querySelector('.var-name');
        const varName = nameInput.value.trim();
        if(!varName) throw new Error("Variant Name খালি রাখা যাবে না।");
        
        const valueRows = item.querySelectorAll('.value-row');
        const values = [];
        const valSet = new Set();
        
        for(let row of valueRows) {
            const valInput = row.querySelector('.val-name');
            const priceInput = row.querySelector('.val-price');
            const valText = valInput.value.trim();
            
            if(!valText) throw new Error("Variant Value খালি রাখা যাবে না।");
            if(valSet.has(valText.toLowerCase())) throw new Error(`একই Variant-এর মধ্যে duplicate value '${valText}' দেওয়া যাবে না।`);
            valSet.add(valText.toLowerCase());
            
            const extraPrice = priceInput.value === '' ? 0 : Number(priceInput.value);
            if(extraPrice < 0) throw new Error("Extra Price নেগেটিভ হতে পারে না।");
            
            values.push({ value: valText, extraPrice: extraPrice });
        }
        
        if(values.length < 2) {
            throw new Error(`প্রতিটি Variant-এ কমপক্ষে ২টি Value থাকতে হবে ('${varName}')`);
        }
        
        variants.push({ name: varName, values: values });
    }
    
    return variants;
}

// 11. Upload Process to Firestore
document.getElementById('productForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  document.getElementById('status').style.color = 'var(--text)';

  try {
    // Comprehensive Validations
    const sellerId = document.getElementById('selectedShopId').value;
    if(!sellerId) throw new Error("দয়া করে শপ সিলেক্ট করুন।");
    
    const name = document.getElementById('name').value.trim();
    const description = document.getElementById('description').value.trim();
    const price = Number(document.getElementById('currentPrice').value);
    const oldPriceInput = document.getElementById('oldPrice').value;
    const oldPrice = oldPriceInput ? Number(oldPriceInput) : price;
    
    if(isNaN(price) || price <= 0) throw new Error("সঠিক বর্তমান দাম লিখুন।");
    if(compressedFiles.length === 0) throw new Error("কমপক্ষে ১টি ছবি আপলোড করা আবশ্যক।");

    // Affiliate Validation
    const isAffOn = document.getElementById('affOn').checked;
    let affiliateVal = "off";
    let discountVal = 0;
    
    if(isAffOn) {
        affiliateVal = "on";
        const discInput = document.getElementById('affiliateDiscount').value;
        if(discInput === '') throw new Error("Affiliate ON থাকলে Discount খালি রাখা যাবে না।");
        discountVal = Number(discInput);
        if(discountVal < 1) throw new Error("Affiliate Discount অবশ্যই ১ বা তার বেশি হতে হবে।");
        if(discountVal >= price) throw new Error("Affiliate Discount অবশ্যই Product-এর বর্তমান দামের চেয়ে কম হতে হবে।");
    }

    // Variants Validation & Data
    document.getElementById('status').innerText = "ভ্যালুয়েশন ও ভ্যারিয়েন্ট চেক করা হচ্ছে...";
    const variants = getValidatedVariants();

    // Image Upload to ImgBB sequentially
    let imageUrls = [];
    for(let i=0; i<compressedFiles.length; i++){
        document.getElementById('status').innerText = `ছবি Upload হচ্ছে ${i+1}/${compressedFiles.length}...`;
        const formData = new FormData();
        formData.append("image", compressedFiles[i]);
        
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
        const imgData = await res.json();
        
        if(!res.ok || !imgData.success){
            throw new Error(`ছবি ${i+1} আপলোড ব্যর্থ হয়েছে। ${imgData.error?.message || 'Unknown Error'}`);
        }
        imageUrls.push(imgData.data.url);
    }

    document.getElementById('status').innerText = "Product Save হচ্ছে...";
    const selectedCategory = JSON.parse(document.getElementById('category').value);
    
    const productData = {
        name: name,
        slug: generateSlug(name),
        description: description,
        price: price,
        oldPrice: oldPrice,
        keywords: keywords,
        images: imageUrls,
        categoryName: selectedCategory.name,
        categorySlug: selectedCategory.slug,
        sellerId: sellerId,
        shopName: document.getElementById('shopSearch').value,
        whatsapp: document.getElementById('selectedShopWhatsapp').value,
        active: true,
        createdAt: serverTimestamp(),
        affiliate: affiliateVal,
        discount: discountVal,
        variants: variants
    };

    await addDoc(collection(db, "products"), productData);

    showPopup("সফল!", "পণ্য সফলভাবে যোগ করা হয়েছে!", "success");
    setTimeout(() => location.reload(), 1500);

  } catch(err){
    console.error("Upload Error:", err);
    document.getElementById('status').innerText = "";
    showPopup("ত্রুটি", err.message);
    btn.disabled = false;
    checkForm();
  }
};
