<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Ghoti Market Admin & Owner Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- GLOBAL LOADING OVERLAY -->
    <div id="auth-loading" class="loading-overlay">
        <div class="spinner-container">
            <svg class="spinner-svg" viewBox="0 0 50 50">
                <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
            <h2>GHOTI MARKET</h2>
            <p>Loading Dashboard Environment...</p>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="auth-wrapper hidden">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo-mark">GM</div>
                <h1>GHOTI MARKET</h1>
                <p>Enterprise Control Center</p>
            </div>
            <form id="login-form" novalidate>
                <div id="auth-error" class="auth-error-box hidden" role="alert"></div>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required placeholder="name@ghotimarket.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn" class="primary-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner hidden"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SHELL (HIDDEN BY DEFAULT) -->
    <div id="dashboard-app" class="app-layout hidden">
        
        <!-- MOBILE SIDEBAR BACKDROP -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo-mark">GM</div>
                <div class="brand-title">
                    <span>GHOTI MARKET</span>
                    <small>Admin Suite</small>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#/" class="nav-item active" data-route="/">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="https://admin.ghotimarket.com/landing/all-landing" class="nav-item" data-route="/landing/all-landing">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    <span>Landing Pages</span>
                </a>
                <a href="https://admin.ghotimarket.com/landing/banner" class="nav-item" data-route="/landing/banner">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    <span>Banner</span>
                </a>
                <a href="https://admin.ghotimarket.com/landing/users" class="nav-item" data-route="/landing/users">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    <span>Landing Users</span>
                </a>
                <a href="https://admin.ghotimarket.com/landing/orders" target="_blank" rel="noopener noreferrer" class="nav-item external-link">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-1.99.9-1.99 2L3 20c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm0 10c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3h2c0 2.76-2.24 5-5 5z"/></svg>
                    <span>Orders</span>
                    <svg class="external-icon" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-mini-card">
                    <div class="user-avatar-placeholder" id="sidebar-initial">U</div>
                    <div class="user-mini-info">
                        <span id="sidebar-email-short">user@ghotimarket.com</span>
                        <span id="sidebar-role-badge" class="badge-pill">ADMIN</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <div class="main-content-wrapper">
            
            <!-- HEADER -->
            <header class="dashboard-header">
                <div class="header-left">
                    <button id="mobile-menu-toggle" class="icon-btn mobile-only" aria-label="Open Menu">
                        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </button>
                    <h1 id="page-header-title">Dashboard</h1>
                </div>
                <div class="header-right">
                    <button class="icon-btn" aria-label="Notifications">
                        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
                    </button>
                    <div class="header-profile-menu">
                        <div class="profile-badge-group">
                            <span id="header-user-email" class="header-email">admin@ghotimarket.com</span>
                            <span id="header-role-pill" class="role-pill admin">ADMIN</span>
                        </div>
                        <button id="logout-btn" class="logout-btn" aria-label="Logout" title="Sign Out">
                            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- DYNAMIC VIEWPORT CONTAINER -->
            <main id="app-view-container" class="view-container">
                <!-- Dynamically injected views go here -->
            </main>

        </div>
    </div>

    <!-- MAIN APPLICATION SCRIPT -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
