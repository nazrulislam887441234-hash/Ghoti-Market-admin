<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>GHOTI MARKET — Admin & Owner Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- GLOBAL INITIAL LOADING / AUTH SPINNER -->
    <div id="global-loader" class="loader-overlay" aria-hidden="false">
        <div class="loader-card">
            <div class="spinner" aria-label="Loading"></div>
            <h2>GHOTI MARKET</h2>
            <p>Verifying secure credentials...</p>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="auth-wrapper hidden">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-tag">GHOTI MARKET</span>
                <h1>Admin Control Center</h1>
                <p>Secure Enterprise Sign In</p>
            </div>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required placeholder="admin@ghotimarket.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••••••" autocomplete="current-password">
                </div>
                <div id="auth-error-msg" class="error-banner hidden" role="alert"></div>
                <button type="submit" id="login-btn" class="btn-primary">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader hidden"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTAINER -->
    <div id="dashboard-layout" class="dashboard-layout hidden">
        
        <!-- MOBILE OVERLAY BACKDROP -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebar" class="sidebar" aria-label="Sidebar Navigation">
            <div class="sidebar-header">
                <div class="logo-box">
                    <svg viewBox="0 0 24 24" class="icon-brand" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    <span>GHOTI MARKET</span>
                </div>
                <button id="sidebar-close-btn" class="icon-btn mobile-only" aria-label="Close menu">
                    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#/" class="nav-item active" data-route="/">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span>Dashboard</span>
                </a>
                <a href="#/landing/all-landing" class="nav-item" data-route="/landing/all-landing">
                    <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16"/></svg>
                    <span>Landing Pages</span>
                </a>
                <a href="#/landing/banner" class="nav-item" data-route="/landing/banner">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span>Banner</span>
                </a>
                <a href="#/landing/users" class="nav-item" data-route="/landing/users">
                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span>Users</span>
                </a>
                <a href="https://ghotimarket.com/landing/orders" target="_blank" rel="noopener noreferrer" class="nav-item">
                    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span>Orders <svg viewBox="0 0 24 24" class="external-icon"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-mini-card">
                    <div class="user-avatar" id="sidebar-avatar-initial">G</div>
                    <div class="user-meta">
                        <span id="sidebar-user-email" class="truncate">loading...</span>
                        <span id="sidebar-role-badge" class="badge-pill">--</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <div class="main-content-wrapper">
            
            <!-- HEADER -->
            <header class="dashboard-header">
                <div class="header-left">
                    <button id="sidebar-toggle-btn" class="icon-btn mobile-only" aria-label="Open menu">
                        <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="page-title-group">
                        <h2 id="current-page-title">Dashboard Overview</h2>
                        <span id="current-page-subtitle" class="page-subtitle">Welcome back to GHOTI MARKET control center</span>
                    </div>
                </div>

                <div class="header-right">
                    <div class="notification-wrapper">
                        <button class="icon-btn" aria-label="Notifications">
                            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                            <span class="notification-dot"></span>
                        </button>
                    </div>
                    <div class="header-divider"></div>
                    <div class="profile-menu-container">
                        <div class="profile-display">
                            <span id="header-user-email" class="header-email">user@ghotimarket.com</span>
                            <span id="header-role-pill" class="role-pill owner">OWNER</span>
                        </div>
                        <button id="logout-btn" class="btn-logout" aria-label="Logout" title="Sign Out">
                            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            <span class="desktop-only">Logout</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- DYNAMIC VIEW PORT -->
            <main id="app-view-port" class="app-view-port">
                <!-- Routed Content Injected Here via JavaScript -->
            </main>
        </div>
    </div>
<script src="app.js"></script>
</body>
</html>
