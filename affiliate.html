<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOTI MARKET - Pro Affiliate Admin Panel</title>

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #FF6A00; --bg: #FFF8F3; --card: #FFF; --text: #2D3748; --muted: #718096; --border: #E2E8F0; --radius: 16px; --shadow: 0 10px 25px -5px rgba(255, 106, 0, 0.08); --success: #10B981; --error: #EF4444; --warning: #F59E0B; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background: var(--bg); padding: 20px; display: none; }
      .auth-loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; gap: 16px; color: var(--primary); font-weight: 600; }
      .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
      .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 16px 24px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 24px; }
        header h1 { color: var(--primary); }
      .logout-btn { background: rgba(239, 68, 68, 0.1); color: var(--error); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
      .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
      .stat-card { background: var(--card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); }
      .stat-title { font-size: 14px; color: var(--muted); }
      .stat-value { font-size: 26px; font-weight: 700; }
      .search-input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 24px; font-size: 15px; }
      .affiliates-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
      .affiliate-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
      .affiliate-name { font-size: 18px; font-weight: 700; }
      .badges { display: flex; gap: 6px; }
      .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
      .badge-verified { background: rgba(16, 185, 129, 0.1); color: var(--success); }
      .badge-active { background: rgba(59, 130, 246, 0.1); color: #3B82F6; }
      .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; border-top: 1px solid var(--border); padding-top: 12px; }
      .detail-grid span:first-child { color: var(--muted); font-weight: 600; }
      .financial { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 12px; padding: 14px; }
      .financial-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
      .net { font-size: 18px; font-weight: 700; color: #15803D; border-top: 1px dashed #BBF7D0; padding-top: 6px; margin-top: 4px; }
      .btn-group { display: flex; gap: 10px; }
      .btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 6px; }
      .btn-edit { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
      .btn-withdraw { background: rgba(16, 185, 129, 0.1); color: var(--success); }
      .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--error); }
      .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
      .modal.active { display: flex; }
      .modal-card { background: #FFF; padding: 28px; border-radius: var(--radius); width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
      .form-group { margin-bottom: 16px; }
      .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
      .form-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; }
      .form-input[disabled] { background: #f1f5f9; cursor: not-allowed; }
      .toast { position: fixed; bottom: 20px; right: 20px; background: #FFF; padding: 12px 20px; border-radius: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-left: 4px solid var(--success); z-index: 2000; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-loading" id="authLoading"><div class="spinner"></div><div>অ্যাডমিন চেক হচ্ছে...</div></div>

    <div class="container">
        <header>
            <h1>GHOTI MARKET Admin</h1>
            <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><span class="stat-title">General Balance</span><span class="stat-value" id="statTotalBalance">৳ 0</span></div>
            <div class="stat-card"><span class="stat-title">Commission 20%</span><span class="stat-value" id="statTotalPending">৳ 0</span></div>
            <div class="stat-card"><span class="stat-title">Total Withdrawn</span><span class="stat-value" id="statTotalEarned">৳ 0</span></div>
            <div class="stat-card"><span class="stat-title">Net Payable</span><span class="stat-value" id="statTotalWithdrawn">৳ 0</span></div>
        </div>

        <input type="text" id="searchInput" class="search-input" placeholder="UID, Email, Phone, Name দিয়ে খুঁজুন...">

        <div class="affiliates-container" id="affiliatesContainer"></div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-card">
            <h2 style="margin-bottom: 20px;">অ্যাফিলিয়েট তথ্য সম্পাদনা</h2>
            <form id="editForm"><div id="modalFields"></div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn" style="background: var(--border);" onclick="closeModal()">বাতিল</button>
                    <button type="submit" class="btn" style="background: var(--primary); color: #FFF;">সংরক্ষণ করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal" id="withdrawModal">
        <div class="modal-card">
            <h2 style="margin-bottom: 20px;">Withdraw টাকা প্রদান</h2>
            <div id="withdrawInfo" style="background:#F0FDF4; padding:12px; border-radius:8px; margin-bottom:16px;"></div>
            <form id="withdrawForm">
                <div class="form-group">
                    <label class="form-label">কত টাকা Withdraw দিলেন?</label>
                    <input type="number" step="0.01" id="withdrawAmount" class="form-input" placeholder="টাকার পরিমাণ" required>
                </div>
                <div class="form-group">
                    <label class="form-label">নোট/ট্রানজেকশন ID</label>
                    <input type="text" id="withdrawNote" class="form-input" placeholder="বিকাশ/নগদ ট্রানজেকশন ID">
                </div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn" style="background: var(--border);" onclick="closeWithdrawModal()">বাতিল</button>
                    <button type="submit" class="btn" style="background: var(--success); color: #FFF;"><i class="fa-solid fa-paper-plane"></i> Withdraw Confirm</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, updateDoc, deleteDoc, onSnapshot, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", authDomain: "ghotimarket.firebaseapp.com", projectId: "ghotimarket", storageBucket: "ghotimarket.appspot.com", messagingSenderId: "9382019283", appId: "1:9382019283:web:abc12345" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "support@ghotimarket.com";

        let allAffiliates = [], allOrders = [], editingUid = null, withdrawUid = null;
        const PROTECTED_FIELDS = ['uid', 'createdAt', 'id'];

        const formatCurrency = (n) => '৳ ' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
        const showToast = (msg) => { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`; document.getElementById('toastContainer').appendChild(t); setTimeout(() => t.remove(), 3000); }

        onAuthStateChanged(auth, async (user) => {
            if (!user || user.email!== ADMIN_EMAIL) { await signOut(auth); window.location.href = 'index.html'; return; }
            document.getElementById('authLoading').style.display = 'none'; document.body.style.display = 'block'; init();
        });
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        function init() {
            onSnapshot(collection(db, 'Affiliates'), snap => { allAffiliates = snap.docs.map(d => ({ id: d.id,...d.data() })); render(); updateStats(); });
            onSnapshot(collection(db, 'order_tracking'), snap => { allOrders = snap.docs.map(d => d.data()).filter(o => o.deliveryStatus === "Delivered" && o.affiliateApplied === true); render(); updateStats(); });
        }

        function calc(aff) {
            let general = 0;
            allOrders.forEach(o => { if (o.affiliateUserId === aff.id) general += Number(o.affiliateDiscount) || 0; });
            const commission = general * 0.20;
            const withdrawn = Number(aff.withdrawn) || 0;
            const net = general - commission - withdrawn; // Net = Total - Commission - Withdrawn
            return { general, commission, withdrawn, net };
        }

        function updateStats() {
            let g=0,c=0,w=0,n=0; allAffiliates.forEach(a=>{const f=calc(a); g+=f.general; c+=f.commission; w+=f.withdrawn; n+=f.net;});
            document.getElementById('statTotalBalance').textContent = formatCurrency(g);
            document.getElementById('statTotalPending').textContent = formatCurrency(c);
            document.getElementById('statTotalEarned').textContent = formatCurrency(w);
            document.getElementById('statTotalWithdrawn').textContent = formatCurrency(n);
        }

        function render(list = allAffiliates) {
            const cont = document.getElementById('affiliatesContainer'); cont.innerHTML = '';
            list.forEach(aff => {
                const fin = calc(aff);
                let details = '';
                for(const [k,v] of Object.entries(aff)){
                    if(PROTECTED_FIELDS.includes(k)) continue;
                    let val = typeof v === 'object' && v?.seconds? new Date(v.seconds*1000).toLocaleDateString('bn-BD') : v;
                    details += `<div><span>${k}:</span><span>${val}</span></div>`;
                }
                cont.innerHTML += `
                <div class="affiliate-card">
                    <div style="display:flex; justify-content:space-between;">
                        <div><div class="affiliate-name">${aff.fullName || aff.name || 'N/A'}</div><div style="font-size:12px; color:var(--muted);">${aff.id}</div></div>
                        <div class="badges">${aff.verified?'<span class="badge badge-verified">Verified</span>':''}${aff.active?'<span class="badge badge-active">Active</span>':''}</div>
                    </div>
                    <div class="detail-grid">${details}</div>
                    <div class="financial">
                        <div class="financial-row"><span>General</span><span>${formatCurrency(fin.general)}</span></div>
                        <div class="financial-row"><span>Commission 20%</span><span>${formatCurrency(fin.commission)}</span></div>
                        <div class="financial-row"><span>Withdrawn</span><span>${formatCurrency(fin.withdrawn)}</span></div>
                        <div class="financial-row net"><span>Net Balance</span><span>${formatCurrency(fin.net)}</span></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-withdraw" onclick="openWithdraw('${aff.id}')"><i class="fa-solid fa-money-bill-transfer"></i> Withdraw</button>
                        <button class="btn btn-edit" onclick="openEdit('${aff.id}')"><i class="fa-solid fa-pen"></i> এডিট</button>
                        <button class="btn btn-delete" onclick="deleteAff('${aff.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }

        // WITHDRAW SYSTEM
        window.openWithdraw = (uid) => {
            withdrawUid = uid;
            const aff = allAffiliates.find(a => a.id === uid);
            const fin = calc(aff);
            document.getElementById('withdrawInfo').innerHTML = `
                <b>${aff.fullName}</b><br>
                Available Net Balance: <b style="color:var(--success)">${formatCurrency(fin.net)}</b><br>
                Already Withdrawn: ${formatCurrency(fin.withdrawn)}
            `;
            document.getElementById('withdrawAmount').max = fin.net;
            document.getElementById('withdrawModal').classList.add('active');
        }
        window.closeWithdrawModal = () => document.getElementById('withdrawModal').classList.remove('active');

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = Number(document.getElementById('withdrawAmount').value);
            const note = document.getElementById('withdrawNote').value;
            if(amount <= 0) return showToast('টাকার পরিমাণ 0 এর বেশি হতে হবে');

            const affRef = doc(db,'Affiliates',withdrawUid);
            const affSnap = await getDoc(affRef);
            const currentWithdrawn = Number(affSnap.data().withdrawn) || 0;
            const newWithdrawn = currentWithdrawn + amount;

            await updateDoc(affRef, {
                withdrawn: newWithdrawn,
                withdrawHistory: arrayUnion({
                    amount: amount,
                    date: serverTimestamp(),
                    note: note,
                    admin: ADMIN_EMAIL
                })
            });
            showToast(`${formatCurrency(amount)} Withdraw সফল`);
            closeWithdrawModal();
            document.getElementById('withdrawForm').reset();
        });

        // EDIT SYSTEM
        window.openEdit = async (uid) => {
            editingUid = uid; const snap = await getDoc(doc(db,'Affiliates',uid)); const data = snap.data();
            let fields = '';
            for(const [k,v] of Object.entries(data)){
                const isProtected = PROTECTED_FIELDS.includes(k);
                if(typeof v === 'boolean'){
                    fields += `<div class="form-group"><label class="form-label">${k}</label><select name="${k}" class="form-input" ${isProtected?'disabled':''}><option value="true" ${v?'selected':''}>True</option><option value="false" ${!v?'selected':''}>False</option></select></div>`;
                } else if(typeof v === 'number'){
                    fields += `<div class="form-group"><label class="form-label">${k}</label><input type="number" step="any" name="${k}" value="${v}" class="form-input" ${isProtected?'disabled':''}></div>`;
                } else {
                    fields += `<div class="form-group"><label class="form-label">${k}</label><input type="text" name="${k}" value="${v||''}" class="form-input" ${isProtected?'disabled':''}></div>`;
                }
            }
            document.getElementById('modalFields').innerHTML = fields;
            document.getElementById('editModal').classList.add('active');
        }
        window.closeModal = () => document.getElementById('editModal').classList.remove('active');

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const formData = new FormData(e.target); const updated = {};
            for(let [k,v] of formData.entries()){
                if(v==='true') updated[k]=true; else if(v==='false') updated[k]=false; else if(!isNaN(v) && v!=='') updated[k]=Number(v); else updated[k]=v;
            }
            await updateDoc(doc(db,'Affiliates',editingUid), updated);
            showToast('সফলভাবে আপডেট হয়েছে'); closeModal();
        });

        window.deleteAff = async (uid) => {
            if(confirm("এই অ্যাফিলিয়েট ডিলিট করবেন?")){ await deleteDoc(doc(db,'Affiliates',uid)); showToast('ডিলিট হয়েছে'); }
        }

        document.getElementById('searchInput').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allAffiliates.filter(a => (a.id+a.email+a.fullName).toLowerCase().includes(term));
            render(filtered);
        }
    </script>
</body>
</html>
