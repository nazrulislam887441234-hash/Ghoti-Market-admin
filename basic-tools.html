<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghoti Admin - Full Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c; --success: #2ecc71; --bg: #f0f3f5; }
        body { font-family: 'Hind Siliguri', sans-serif; background-color: var(--bg); margin: 0; overflow-x: hidden; }
        
        #login-guard { position: fixed; inset: 0; background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: white; padding: 30px; border-radius: 15px; text-align: center; width: 85%; max-width: 320px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        header { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 22px; font-weight: bold; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        
        .card { background: white; padding: 20px 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); }
        .card i { font-size: 30px; color: var(--accent); margin-bottom: 8px; }
        .card h3 { margin: 0; font-size: 14px; color: #333; }

        .section { display: none; padding: 15px; min-height: 100vh; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .back-btn { background: #7f8c8d; color: white; border: none; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .item-list { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .add-more-btn { background: var(--success); color: white; padding: 15px; border-radius: 8px; width: 100%; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 16px; }
        
        #ad-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 15px; }
        textarea { height: 150px; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; resize: none; }
        input[type="number"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        .img-preview { width: 100%; border-radius: 8px; margin-top: 8px; max-height: 180px; object-fit: cover; }
        .delete-icon { color: var(--danger); font-size: 20px; cursor: pointer; padding: 5px; }
        .action-btn { padding: 5px 10px; border-radius: 5px; border: none; color: white; cursor: pointer; font-size: 12px; margin-left: 5px; }

        /* Professional Sticky Search and Filter UI */
        .sticky-controls {
            position: sticky;
            top: 0;
            background: var(--bg);
            padding: 10px 0;
            z-index: 100;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .search-bar-container {
            position: relative;
            width: 100%;
        }
        .search-bar-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
        }
        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
            outline: none;
            transition: all 0.2s;
            background: white;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.15);
        }
        .filter-select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
            background: white;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="login-guard">
        <div class="login-box">
            <h3>অ্যাডমিন লগইন</h3>
            <input type="email" id="adminEmail" placeholder="ইমেইল">
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড">
            <button class="add-more-btn" onclick="loginAdmin()">লগইন করুন</button>
        </div>
    </div>

    <div id="ad-modal">
        <div class="modal-content">
            <h3 id="modal-title">নতুন অ্যাড যোগ করুন</h3>
            <textarea id="ad-script-input" placeholder="এখানে অ্যাড HTML স্ক্রিপ্ট পেস্ট করুন..."></textarea>
            <input type="number" id="ad-days-input" placeholder="কতদিন চলবে? (সংখ্যা দিন)">
            <button class="add-more-btn" onclick="saveAd()">অ্যাড সেভ করুন (Enter)</button>
            <button class="back-btn" style="width:100%; margin-top:10px; justify-content: center;" onclick="closeModal()">বাতিল</button>
        </div>
    </div>

    <header>Ghoti Admin Panel</header>

    <div id="main-menu" class="menu-grid">
        <div class="card" onclick="openSection('verify-sec')"><i class="fas fa-user-check"></i><h3>ভেরিফিকেশন চেক</h3></div>
        <div class="card" onclick="openSection('unlock-sec')"><i class="fas fa-unlock"></i><h3>প্রোফাইল আনলক</h3></div>
        <div class="card" onclick="openSection('user-sec')"><i class="fas fa-user-slash"></i><h3>ইউজার ব্যান</h3></div>
    </div>

    <div id="verify-sec" class="section">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> ফিরে যান</button>
        <h2>Seller Verification</h2>
        <div class="sticky-controls">
            <div class="search-bar-container">
                <i class="fas fa-search"></i>
                <input type="text" id="verify-search" class="search-input" placeholder="ইমেইল, দোকানের নাম বা UID লিখে খুঁজুন" oninput="filterVerifyData()">
            </div>
            <select id="verify-filter" class="filter-select" onchange="filterVerifyData()">
                <option value="all">All Users</option>
                <option value="pending">Pending Verification</option>
                <option value="verified">Verified Users</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>
        <div id="verify-list"></div>
    </div>

    <div id="unlock-sec" class="section">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> ফিরে যান</button>
        <h2>Profile Unlock Manager</h2>
        <div class="sticky-controls">
            <div class="search-bar-container">
                <i class="fas fa-search"></i>
                <input type="text" id="unlock-search" class="search-input" placeholder="ইমেইল, দোকানের নাম বা UID লিখে খুঁজুন" oninput="filterUnlockData()">
            </div>
            <select id="unlock-filter" class="filter-select" onchange="filterUnlockData()">
                <option value="all">All</option>
                <option value="unlocked">Unlocked</option>
                <option value="locked">Locked</option>
                <option value="expired">Expired Unlock</option>
            </select>
        </div>
        <div id="unlock-list"></div>
    </div>

    <div id="user-sec" class="section">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> ফিরে যান</button>
        <h2>ইউজার তালিকা</h2>
        <div class="sticky-controls">
            <div class="search-bar-container">
                <i class="fas fa-search"></i>
                <input type="text" id="user-search" class="search-input" placeholder="ইমেইল, দোকানের নাম বা UID লিখে খুঁজুন" oninput="filterUserData()">
            </div>
            <select id="user-filter" class="filter-select" onchange="filterUserData()">
                <option value="all">All Users</option>
                <option value="active">Active</option>
                <option value="banned">Banned</option>
                <option value="verified">Verified</option>
                <option value="pending">Pending</option>
            </select>
        </div>
        <div id="user-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
            projectId: "ghotimarket"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const imgbbKey = "e1da51b6d309ac3a5a235b5088ebc334";

        let allUsersCache = [];

        // এডমিন লগইন চেক
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "support@ghotimarket.com") {
                document.getElementById('login-guard').style.display = 'none';
            }
        });

        window.loginAdmin = async () => {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch(e) { alert("লগইন ব্যর্থ! ইমেইল বা পাসওয়ার্ড চেক করুন।"); }
        }

        window.openSection = (id) => {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'user-sec' || id === 'verify-sec' || id === 'unlock-sec') {
                fetchAllUsersAndRender(id);
            }
        }

        window.goBack = () => {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById('main-menu').style.display = 'grid';
        }

        function fetchAllUsersAndRender(sectionId) {
            onSnapshot(collection(db, "users"), (snap) => {
                allUsersCache = [];
                snap.forEach(d => {
                    allUsersCache.push({ id: d.id, ...d.data() });
                });
                if(sectionId === 'verify-sec') filterVerifyData();
                if(sectionId === 'unlock-sec') filterUnlockData();
                if(sectionId === 'user-sec') filterUserData();
            });
        }

        function matchesSearch(u, queryText) {
            if (!queryText) return true;
            const q = queryText.toLowerCase().trim();
            const searchableValues = [
                u.id,
                u.shopName,
                u.email,
                u.phone,
                u.name,
                u.phoneNumber
            ];
            
            // Also check any available text fields in user document
            for (let key in u) {
                if (typeof u[key] === 'string' || typeof u[key] === 'number') {
                    searchableValues.push(String(u[key]));
                }
            }

            return searchableValues.some(val => val && String(val).toLowerCase().includes(q));
        }

        window.filterVerifyData = () => {
            const searchText = document.getElementById('verify-search').value;
            const filterVal = document.getElementById('verify-filter').value;

            const filtered = allUsersCache.filter(u => {
                const matchesText = matchesSearch(u, searchText);
                if (!matchesText) return false;

                if (filterVal === 'pending') return !u.verified;
                if (filterVal === 'verified') return u.verified === true;
                if (filterVal === 'rejected') return u.status === 'rejected' || u.verified === 'rejected';
                return true;
            });

            let html = "";
            filtered.forEach(u => {
                const statusText = u.verified ? "Verified" : "Pending";
                html += `<div class="item-list">
                    <div><strong>${u.shopName || 'Shop'}</strong><br><small>${u.email || u.id}</small><br><small>${statusText}</small></div>
                    <div>
                        <button class="action-btn" style="background:var(--accent)" onclick="viewDetails('${u.id}')">View</button>
                        <button class="action-btn" style="background:var(--success)" onclick="verifyUser('${u.id}', true)">Verify</button>
                        <button class="action-btn" style="background:var(--danger)" onclick="deleteItem('users','${u.id}')">Delete</button>
                    </div>
                </div>`;
            });
            document.getElementById('verify-list').innerHTML = html;
        }

        window.filterUnlockData = () => {
            const searchText = document.getElementById('unlock-search').value;
            const filterVal = document.getElementById('unlock-filter').value;
            const now = Date.now();

            const filtered = allUsersCache.filter(u => {
                const matchesText = matchesSearch(u, searchText);
                if (!matchesText) return false;

                const unlockUntil = u.profileUnlockedUntil || 0;
                const isUnlocked = unlockUntil > now;
                const isExpired = unlockUntil > 0 && unlockUntil <= now;

                if (filterVal === 'unlocked') return isUnlocked;
                if (filterVal === 'locked') return !isUnlocked && !isExpired;
                if (filterVal === 'expired') return isExpired;
                return true;
            });

            let html = "";
            filtered.forEach(u => {
                const isUnlocked = (u.profileUnlockedUntil || 0) > now;
                html += `<div class="item-list">
                    <div><strong>${u.email || u.id}</strong><br><small>${isUnlocked ? 'Unlocked' : 'Locked'}</small></div>
                    <div>
                        <button class="action-btn" style="background:var(--success)" onclick="unlockPopup('${u.id}')">Unlock</button>
                        <button class="action-btn" style="background:var(--danger)" onclick="lockUser('${u.id}')">Lock</button>
                    </div>
                </div>`;
            });
            document.getElementById('unlock-list').innerHTML = html;
        }

        window.filterUserData = () => {
            const searchText = document.getElementById('user-search').value;
            const filterVal = document.getElementById('user-filter').value;

            const filtered = allUsersCache.filter(u => {
                const matchesText = matchesSearch(u, searchText);
                if (!matchesText) return false;

                if (filterVal === 'active') return u.active === true;
                if (filterVal === 'banned') return u.active === false || u.banned === true;
                if (filterVal === 'verified') return u.verified === true;
                if (filterVal === 'pending') return !u.verified;
                return true;
            });

            let html = "";
            filtered.forEach(u => {
                html += `<div class="item-list"><div><strong>${u.shopName || 'No Name'}</strong><br><small>${u.email || u.id}</small></div><i class="fas fa-trash-alt delete-icon" onclick="deleteItem('users','${u.id}')"></i></div>`;
            });
            document.getElementById('user-list').innerHTML = html;
        }

        window.verifyUser = async (id, status) => { await updateDoc(doc(db, "users", id), { verified: status }); alert("Status Updated!"); }
        window.unlockPopup = async (id) => {
            const days = prompt("কতদিন আনলক রাখতে চান? (দিন লিখুন)");
            if(days) {
                const expiry = Date.now() + (parseInt(days) * 24 * 60 * 60 * 1000);
                await updateDoc(doc(db, "users", id), { profileUnlockedUntil: expiry, active: true });
                alert("Profile Unlocked!");
            }
        }
        window.lockUser = async (id) => { await updateDoc(doc(db, "users", id), { profileUnlockedUntil: 0, active: false }); alert("Profile Locked!"); }
        window.viewDetails = async (id) => {
            const target = allUsersCache.find(d => d.id === id);
            if(target) alert(JSON.stringify(target, null, 2));
        }
        window.deleteItem = async (col, id) => { if(confirm("ডিলিট করতে চান?")) await deleteDoc(doc(db, col, id)); }
    </script>
</body>
</html>
