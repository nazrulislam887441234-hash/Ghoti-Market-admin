<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Balance Management - GHOTI MARKET</title>
  
  <!-- Google Font: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #ff6a00;
      --primary-dark: #e05d00;
      --primary-light: #fff0eb;
      --secondary: #ff8533;
      --bg: #fff7f1;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #fee2d5;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbebf;
      --radius: 16px;
      --shadow-sm: 0 2px 8px rgba(255, 106, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(255, 106, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 50px;
    }

    .bg-blob {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 106, 0, 0.1), rgba(255, 133, 51, 0.04));
      filter: blur(70px);
      z-index: -1;
      pointer-events: none;
    }
    .blob-1 { top: -60px; left: -60px; }
    .blob-2 { bottom: 5%; right: -60px; }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .auth-spinner {
      font-size: 2.5rem;
      color: var(--primary);
    }
    .auth-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-header {
      text-align: center;
    }

    .login-header .logo-text {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }

    .login-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
    }

    .btn-login {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 106, 0, 0.25);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-login:hover {
      transform: translateY(-2px);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #ffffff;
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid var(--primary);
      animation: slideIn 0.3s ease-out forwards;
      max-width: 380px;
      font-weight: 500;
    }

    .toast.error { border-left-color: var(--danger); }
    .toast.success { border-left-color: var(--success); }
    .toast.warning { border-left-color: var(--warning); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .app-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      padding: 14px 20px;
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title .logo-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
    }

    .brand-title .page-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-dashboard {
      background-color: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-dashboard:hover {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-logout {
      background-color: var(--danger-light);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-logout:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .summary-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .summary-title {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .summary-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-value.add { color: var(--success); }
    .summary-value.deduct { color: var(--danger); }

    .admin-control-card {
      background: linear-gradient(135deg, #ffffff 0%, #fff0eb 100%);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-md);
    }

    .card-title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card-title-bar h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .form-full {
        grid-column: span 2;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .seller-preview-card {
      background: #ffffff;
      border: 1px dashed var(--primary);
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .seller-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--border);
      object-fit: cover;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.3rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .seller-info-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .seller-name {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);
    }

    .seller-sub-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .seller-badges {
      display: flex;
      gap: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .badge-dot {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-submit-balance {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 106, 0, 0.25);
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-submit-balance:hover {
      transform: translateY(-2px);
    }

    .btn-submit-balance:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .controls-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      padding-left: 40px;
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      font-size: 0.88rem;
      color: var(--text-main);
      outline: none;
    }

    .btn-action-primary {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .btn-action-primary:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tx-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .tx-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .tx-type-tag {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tx-icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .tx-icon-badge.add { background: var(--success-light); color: var(--success); }
    .tx-icon-badge.deduct { background: var(--danger-light); color: var(--danger); }
    .tx-icon-badge.buy { background: var(--primary-light); color: var(--primary); }
    .tx-icon-badge.default { background: #f3f4f6; color: #4b5563; }

    .tx-main-info {
      display: flex;
      flex-direction: column;
    }

    .tx-type-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .tx-seller-id {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .tx-amount {
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .tx-amount.add { color: var(--success); }
    .tx-amount.deduct { color: var(--danger); }

    .tx-grid-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px 12px;
      font-size: 0.82rem;
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .tx-meta-item {
      display: flex;
      flex-direction: column;
    }

    .tx-meta-label {
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .tx-meta-value {
      color: var(--text-main);
      font-weight: 600;
    }

    .tx-note-box {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tx-footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .tx-btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-tx-opt {
      border: 1px solid var(--border);
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-tx-opt.edit:hover { background: var(--primary-light); color: var(--primary); }
    .btn-tx-opt.delete:hover { background: var(--danger-light); color: var(--danger); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-md);
      animation: modalScale 0.2s ease-out;
    }

    @keyframes modalScale {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .btn-modal-cancel {
      background: #f3f4f6;
      color: var(--text-main);
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-modal-confirm {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-modal-danger {
      background: var(--danger);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <!-- Loading Overlay -->
  <div id="authOverlay" class="auth-overlay">
    <i class="fa-solid fa-shield-halved fa-spin auth-spinner"></i>
    <div class="auth-text">Admin Account যাচাই করা হচ্ছে...</div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Login Form Screen -->
  <div id="loginContainer" class="login-container hidden">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-text">GHOTI MARKET</div>
        <p>Admin Control Panel Login</p>
      </div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" for="loginEmail">Admin Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="support@ghotimarket.com" required autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()">
              <i class="fa-solid fa-eye" id="pwdToggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-login">
          <i id="btnLoginSpinner" class="fa-solid fa-spinner fa-spin hidden"></i>
          <span id="btnLoginText">Admin Login</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main Admin Dashboard -->
  <div id="mainContainer" class="hidden">
    
    <header class="app-header">
      <div class="header-container">
        <div class="brand-title">
          <span class="logo-text">GHOTI MARKET</span>
          <span class="page-subtitle">Admin Balance Management</span>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-dashboard btn-logout" onclick="handleAdminLogout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">

      <!-- Summary Grid -->
      <section class="summary-grid">
        <div class="summary-card">
          <span class="summary-title">Total Transactions</span>
          <span class="summary-value" id="sumTotalTx">0</span>
        </div>
        <div class="summary-card">
          <span class="summary-title">Total Added</span>
          <span class="summary-value add" id="sumTotalAdd">৳0</span>
        </div>
        <div class="summary-card">
          <span class="summary-title">Total Deducted</span>
          <span class="summary-value deduct" id="sumTotalDeduct">৳0</span>
        </div>
        <div class="summary-card">
          <span class="summary-title">Subscription Buys</span>
          <span class="summary-value" id="sumTotalSub">0</span>
        </div>
      </section>

      <!-- Balance Control Form -->
      <section class="card admin-control-card">
        <div class="card-title-bar">
          <i class="fa-solid fa-scale-balanced" style="color: var(--primary); font-size: 1.2rem;"></i>
          <h2>Seller Balance Management</h2>
        </div>

        <form id="balanceControlForm" onsubmit="handleBalanceSubmit(event)">
          <div class="form-grid">
            
            <div class="form-group form-full">
              <label class="form-label" for="sellerUidInput">Seller UID</label>
              <input type="text" id="sellerUidInput" class="form-control" placeholder="Seller Auth UID প্রদান করুন (যেমন: 115qbNBgBrheiEOAd...)" required autocomplete="off">
              
              <!-- Live Preview Card -->
              <div id="sellerPreview" class="seller-preview-card hidden">
                <div id="sellerAvatarBox"></div>
                <div class="seller-info-details">
                  <span id="sellerShopName" class="seller-name">--</span>
                  <span id="sellerSubMeta" class="seller-sub-meta">--</span>
                  <div class="seller-badges">
                    <span id="sellerBalDisplay" style="color: var(--primary); font-weight:700;">Balance: ৳0</span>
                    <span id="sellerStatusActive"></span>
                    <span id="sellerStatusVerified"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="operationSelect">Operation</label>
              <select id="operationSelect" class="form-control">
                <option value="ADD">+ Add Balance</option>
                <option value="REMOVE">- Remove Balance</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="amountInput">Amount (৳)</label>
              <input type="number" id="amountInput" class="form-control" placeholder="যেমন: 900" min="1" step="any" required>
            </div>

            <div class="form-group form-full">
              <label class="form-label" for="noteInput">Note (Optional)</label>
              <input type="text" id="noteInput" class="form-control" placeholder="টাকা যোগ/কাটার বিবরণ লিখুন...">
            </div>

            <div class="form-group form-full">
              <button type="submit" id="btnSubmitBalance" class="btn-submit-balance">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>Balance Update করুন</span>
              </button>
            </div>

          </div>
        </form>
      </section>

      <!-- Transaction Search & Filters -->
      <section class="controls-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="form-control search-input" placeholder="Seller UID / Note / Transaction Type দিয়ে খুঁজুন..." oninput="handleSearchFilter()">
        </div>

        <div class="filter-group">
          <select id="typeFilter" class="filter-select" onchange="handleSearchFilter()">
            <option value="ALL">All Types</option>
            <option value="ADMIN_BALANCE_ADD">ADMIN_BALANCE_ADD</option>
            <option value="ADMIN_BALANCE_REMOVE">ADMIN_BALANCE_REMOVE</option>
            <option value="SUBSCRIPTION_BUY">SUBSCRIPTION_BUY</option>
            <option value="REFUND">REFUND</option>
          </select>
        </div>
      </section>

      <!-- Transactions History List -->
      <section>
        <div class="card-title-bar" style="margin-bottom: 12px;">
          <h2>All Seller Transactions</h2>
        </div>

        <div id="transactionContainer" class="transaction-list">
          <div class="card skeleton" style="height: 120px;"></div>
          <div class="card skeleton" style="height: 120px;"></div>
        </div>

        <button id="btnLoadMore" class="btn-action-primary hidden" style="width: 100%; margin-top: 15px; justify-content: center;" onclick="loadMoreTransactions()">
          আরও দেখুন <i class="fa-solid fa-chevron-down"></i>
        </button>
      </section>

    </main>
  </div>

  <!-- Dynamic Modal Backdrop -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modalBox" class="modal-box"></div>
  </div>

  <!-- Firebase v10 Modular SDK Execution Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, getDocs, collection, query, where, limit, 
      onSnapshot, runTransaction, serverTimestamp, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
  apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
  authDomain: "ghotimarket.firebaseapp.com",
  databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
  projectId: "ghotimarket",
  storageBucket: "ghotimarket.firebasestorage.app",
  messagingSenderId: "481257644093",
  appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
  measurementId: "G-4SR8V2EKC1"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "support@ghotimarket.com";
    let currentAdminUser = null;
    let dashboardInitialized = false;

    let rawTransactions = [];
    let fetchTxLimit = 50;
    let txUnsubscribe = null;

    // Toast Alert Helper
    window.showToast = function(message, type = 'error') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      let icon = 'fa-circle-exclamation';
      if (type === 'success') icon = 'fa-circle-check';
      if (type === 'warning') icon = 'fa-triangle-exclamation';

      toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => { toast.remove(); }, 4000);
    };

    window.togglePasswordVisibility = function() {
      const pwdInput = document.getElementById("loginPassword");
      const icon = document.getElementById("pwdToggleIcon");
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        pwdInput.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    };

    // Firebase Auth State Listener
    onAuthStateChanged(auth, async (user) => {
      const authOverlay = document.getElementById("authOverlay");
      const loginContainer = document.getElementById("loginContainer");
      const mainContainer = document.getElementById("mainContainer");

      authOverlay.classList.add("hidden");

      if (!user) {
        currentAdminUser = null;
        mainContainer.classList.add("hidden");
        loginContainer.classList.remove("hidden");
        return;
      }

      // Exact Email Check for Admin
      if (user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        currentAdminUser = user;
        loginContainer.classList.add("hidden");
        mainContainer.classList.remove("hidden");

        if (!dashboardInitialized) {
          initAdminDashboard();
          dashboardInitialized = true;
        }
      } else {
        showToast("আপনার Admin permission নেই", "error");
        await signOut(auth);
        currentAdminUser = null;
        mainContainer.classList.add("hidden");
        loginContainer.classList.remove("hidden");
      }
    });

    window.handleAdminLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btnSubmit = document.getElementById("btnLoginSubmit");
      const btnText = document.getElementById("btnLoginText");
      const btnSpinner = document.getElementById("btnLoginSpinner");

      if (!email || !password) {
        showToast("ইমেইল এবং পাসওয়ার্ড প্রদান করুন", "error");
        return;
      }

      btnSubmit.disabled = true;
      btnText.textContent = "লগইন হচ্ছে...";
      btnSpinner.classList.remove("hidden");

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error("Login Error:", error);
        let errMsg = "লগইন করতে সমস্যা হয়েছে।";
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
          errMsg = "ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।";
        } else if (error.code === 'auth/too-many-requests') {
          errMsg = "অনেকবার ভুল চেষ্টা করা হয়েছে। কিছুক্ষণ পর চেষ্টা করুন।";
        }
        showToast(errMsg, "error");
      } finally {
        btnSubmit.disabled = false;
        btnText.textContent = "Admin Login";
        btnSpinner.classList.add("hidden");
      }
    };

    window.handleAdminLogout = async function() {
      try {
        if (txUnsubscribe) txUnsubscribe();
        dashboardInitialized = false;
        await signOut(auth);
        showToast("সফলভাবে লগআউট করা হয়েছে", "success");
      } catch (err) {
        showToast("লগআউট করতে সমস্যা হয়েছে", "error");
      }
    };

    function initAdminDashboard() {
      setupSellerUidInputListener();
      listenToTransactions();
    }

    // Direct seller lookup helper
    async function lookupSeller(uid) {
      if (!uid) return null;
      
      // Step 1: Direct document lookup users/{sellerUID}
      try {
        const userRef = doc(db, "users", uid);
        const userSnap = await getDoc(userRef);
        if (userSnap.exists()) {
          return { id: userSnap.id, data: userSnap.data() };
        }
      } catch (e) {
        console.warn("Direct lookup warning:", e);
      }

      // Step 2: Fallback query where("uid", "==", sellerUID)
      try {
        const q = query(collection(db, "users"), where("uid", "==", uid), limit(1));
        const qSnap = await getDocs(q);
        if (!qSnap.empty) {
          const matchedDoc = qSnap.docs[0];
          return { id: matchedDoc.id, data: matchedDoc.data() };
        }
      } catch (e) {
        console.warn("Fallback query warning:", e);
      }

      return null;
    }

    // Live Seller Preview Trigger
    function setupSellerUidInputListener() {
      const input = document.getElementById("sellerUidInput");
      let debounceTimeout = null;

      input.addEventListener("input", (e) => {
        clearTimeout(debounceTimeout);
        const uid = e.target.value.trim();
        const previewEl = document.getElementById("sellerPreview");

        if (uid.length < 5) {
          previewEl.classList.add("hidden");
          return;
        }

        debounceTimeout = setTimeout(async () => {
          const sellerResult = await lookupSeller(uid);
          if (sellerResult) {
            renderSellerPreview(sellerResult.data, sellerResult.id);
            previewEl.classList.remove("hidden");
          } else {
            previewEl.classList.add("hidden");
          }
        }, 300);
      });
    }

    function renderSellerPreview(data, docId) {
      const avatarBox = document.getElementById("sellerAvatarBox");
      const shopNameEl = document.getElementById("sellerShopName");
      const subMetaEl = document.getElementById("sellerSubMeta");
      const balEl = document.getElementById("sellerBalDisplay");
      const activeEl = document.getElementById("sellerStatusActive");
      const verifiedEl = document.getElementById("sellerStatusVerified");

      const shopName = data.shopName || data.fullName || "Unknown Seller";
      const username = data.username ? `@${data.username}` : "";
      const email = data.email || "";

      shopNameEl.textContent = shopName;
      subMetaEl.textContent = [username, email, `DocID: ${docId}`].filter(Boolean).join(" • ");

      const balance = Number(data.balance) || 0;
      balEl.textContent = `Balance: ৳${balance.toLocaleString('bn-BD', {minimumFractionDigits: 2})}`;

      activeEl.className = "badge-dot";
      activeEl.innerHTML = data.active ? `<span style="color:var(--success)">🟢 Active</span>` : `<span style="color:var(--danger)">🔴 Inactive</span>`;

      verifiedEl.className = "badge-dot";
      verifiedEl.innerHTML = data.verified ? `<span style="color:var(--success)">🟢 Verified</span>` : `<span style="color:var(--warning)">🟠 Unverified</span>`;

      if (data.shopLogo) {
        avatarBox.innerHTML = `<img src="${data.shopLogo}" class="seller-avatar" alt="Logo">`;
      } else {
        avatarBox.innerHTML = `<div class="seller-avatar">${shopName.charAt(0).toUpperCase()}</div>`;
      }
    }

    // Balance Submit Handler using Firestore Transaction
    window.handleBalanceSubmit = async function(e) {
      e.preventDefault();

      const sellerUid = document.getElementById("sellerUidInput").value.trim();
      const opType = document.getElementById("operationSelect").value;
      const amountVal = parseFloat(document.getElementById("amountInput").value);
      const noteVal = document.getElementById("noteInput").value.trim();

      if (!sellerUid) {
        showToast("দয়া করে সঠিক Seller UID দিন", "error");
        return;
      }

      if (isNaN(amountVal) || amountVal <= 0) {
        showToast("Amount অবশ্যই ০ এর চেয়ে বেশি হতে হবে", "error");
        return;
      }

      const btnSubmit = document.getElementById("btnSubmitBalance");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;

      try {
        if (!currentAdminUser || currentAdminUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
          throw new Error("ADMIN_AUTH_REQUIRED");
        }

        // Validate seller first
        const sellerObj = await lookupSeller(sellerUid);
        if (!sellerObj) {
          throw new Error("SELLER_NOT_FOUND");
        }

        const actualDocumentId = sellerObj.id;

        // Execute Atomic Transaction
        await runTransaction(db, async (transaction) => {
          const userRef = doc(db, "users", actualDocumentId);
          const userSnap = await transaction.get(userRef);

          if (!userSnap.exists()) {
            throw new Error("SELLER_NOT_FOUND");
          }

          const currentBalance = Number(userSnap.data().balance || 0);
          let newBalance = 0;
          let signedAmount = 0;
          let txType = "";

          if (opType === "ADD") {
            newBalance = currentBalance + amountVal;
            signedAmount = amountVal;
            txType = "ADMIN_BALANCE_ADD";
          } else if (opType === "REMOVE") {
            newBalance = currentBalance - amountVal;
            if (newBalance < 0) {
              throw new Error("INSUFFICIENT_BALANCE");
            }
            signedAmount = -amountVal;
            txType = "ADMIN_BALANCE_REMOVE";
          }

          // 1. Update Seller Document Balance
          transaction.update(userRef, {
            balance: newBalance,
            updatedAt: serverTimestamp()
          });

          // 2. Add History Entry in users_transection
          const newTxRef = doc(collection(db, "users_transection"));
          transaction.set(newTxRef, {
            userId: actualDocumentId,
            amount: signedAmount,
            type: txType,
            packageName: "NO",
            packageDays: 0,
            packagePrice: 0,
            prevBalance: currentBalance,
            newBalance: newBalance,
            note: noteVal || (opType === "ADD" ? "টাকা যোগ করা হয়েছে" : "টাকা কাটা হয়েছে"),
            createdAt: serverTimestamp(),
            createdBy: currentAdminUser.email
          });
        });

        showToast("✅ Seller Balance সফলভাবে Update হয়েছে!", "success");
        document.getElementById("amountInput").value = "";
        document.getElementById("noteInput").value = "";

        // Re-preview Updated Seller Status
        const updatedSeller = await lookupSeller(actualDocumentId);
        if (updatedSeller) {
          renderSellerPreview(updatedSeller.data, updatedSeller.id);
        }

      } catch (err) {
        console.error("Balance Submit Error:", err);
        if (err.message === "ADMIN_AUTH_REQUIRED") {
          showToast("Admin Login প্রয়োজন", "error");
        } else if (err.message === "SELLER_NOT_FOUND") {
          showToast("এই UID-এর কোনো Seller পাওয়া যায়নি", "error");
        } else if (err.message === "INSUFFICIENT_BALANCE") {
          showToast("Seller-এর পর্যাপ্ত Balance নেই (Negative balance গ্রহণযোগ্য নয়)", "error");
        } else if (err.code === "permission-denied") {
          showToast("Firestore permission denied — Security Rules অথবা Admin Authentication check করুন", "error");
        } else {
          showToast("Balance Update করতে ব্যর্থ হয়েছে", "error");
        }
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> Balance Update করুন`;
      }
    };

    // Realtime Transactions Listener
    function listenToTransactions() {
      if (txUnsubscribe) txUnsubscribe();

      const txColRef = collection(db, "users_transection");
      const q = query(txColRef, limit(fetchTxLimit));

      txUnsubscribe = onSnapshot(q, (snapshot) => {
        let list = [];
        snapshot.forEach((docSnap) => {
          list.push({ id: docSnap.id, ...docSnap.data() });
        });

        list.sort((a, b) => getSafeTime(b.createdAt) - getSafeTime(a.createdAt));

        rawTransactions = list;
        calculateSummary(list);
        handleSearchFilter();
      }, (err) => {
        console.error("Transactions load error:", err);
        showToast("Transaction history লোড করতে সমস্যা হয়েছে", "error");
      });
    }

    function getSafeTime(createdAt) {
      if (!createdAt) return 0;
      if (typeof createdAt.toDate === 'function') return createdAt.toDate().getTime();
      if (createdAt instanceof Date) return createdAt.getTime();
      if (typeof createdAt === 'number') return createdAt;
      return 0;
    }

    function calculateSummary(list) {
      let totalAdd = 0;
      let totalDeduct = 0;
      let subCount = 0;

      list.forEach((tx) => {
        const amt = Number(tx.amount) || 0;
        if (amt > 0 || tx.type === 'ADMIN_BALANCE_ADD') {
          totalAdd += Math.abs(amt);
        } else if (amt < 0 || tx.type === 'ADMIN_BALANCE_REMOVE') {
          totalDeduct += Math.abs(amt);
        }

        if (tx.type === 'SUBSCRIPTION_BUY') {
          subCount++;
        }
      });

      document.getElementById("sumTotalTx").textContent = list.length;
      document.getElementById("sumTotalAdd").textContent = `৳${totalAdd.toLocaleString('bn-BD')}`;
      document.getElementById("sumTotalDeduct").textContent = `৳${totalDeduct.toLocaleString('bn-BD')}`;
      document.getElementById("sumTotalSub").textContent = subCount;
    }

    window.handleSearchFilter = function() {
      const searchVal = document.getElementById("searchInput").value.trim().toLowerCase();
      const typeVal = document.getElementById("typeFilter").value;

      const filtered = rawTransactions.filter((tx) => {
        if (typeVal !== "ALL" && tx.type !== typeVal) return false;

        if (searchVal) {
          const matchDocId = tx.id.toLowerCase().includes(searchVal);
          const matchUid = (tx.userId || "").toLowerCase().includes(searchVal);
          const matchType = (tx.type || "").toLowerCase().includes(searchVal);
          const matchNote = (tx.note || "").toLowerCase().includes(searchVal);
          return matchDocId || matchUid || matchType || matchNote;
        }

        return true;
      });

      renderTransactionList(filtered);
    };

    function renderTransactionList(list) {
      const container = document.getElementById("transactionContainer");
      const btnLoadMore = document.getElementById("btnLoadMore");

      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding:30px; color:var(--text-muted);">
            <i class="fa-solid fa-receipt" style="font-size:2.5rem; margin-bottom:8px; color:var(--border);"></i>
            <div>কোনো Transaction পাওয়া যায়নি।</div>
          </div>`;
        btnLoadMore.classList.add("hidden");
        return;
      }

      list.forEach((tx) => {
        const amt = Number(tx.amount) || 0;
        const isNeg = amt < 0;

        let iconStyle = "default";
        let iconClass = "fa-money-bill-transfer";

        if (tx.type === "ADMIN_BALANCE_ADD") { iconStyle = "add"; iconClass = "fa-plus"; }
        else if (tx.type === "ADMIN_BALANCE_REMOVE") { iconStyle = "deduct"; iconClass = "fa-minus"; }
        else if (tx.type === "SUBSCRIPTION_BUY") { iconStyle = "buy"; iconClass = "fa-cart-shopping"; }

        const amountFormatted = Math.abs(amt).toLocaleString('bn-BD', {minimumFractionDigits: 2});
        const amountDisplay = isNeg 
          ? `<span class="tx-amount deduct">- ৳${amountFormatted}</span>`
          : `<span class="tx-amount add">+ ৳${amountFormatted}</span>`;

        const dateStr = formatBengaliDate(tx.createdAt);

        const card = document.createElement("div");
        card.className = "tx-card";

        card.innerHTML = `
          <div class="tx-card-header">
            <div class="tx-type-tag">
              <div class="tx-icon-badge ${iconStyle}">
                <i class="fa-solid ${iconClass}"></i>
              </div>
              <div class="tx-main-info">
                <span class="tx-type-title">${tx.type || 'TRANSACTION'}</span>
                <span class="tx-seller-id">Seller UID: ${tx.userId || 'N/A'}</span>
              </div>
            </div>
            ${amountDisplay}
          </div>

          <div class="tx-grid-details">
            <div class="tx-meta-item">
              <span class="tx-meta-label">Prev Balance</span>
              <span class="tx-meta-value">৳${tx.prevBalance !== undefined ? tx.prevBalance : 'N/A'}</span>
            </div>
            <div class="tx-meta-item">
              <span class="tx-meta-label">New Balance</span>
              <span class="tx-meta-value">৳${tx.newBalance !== undefined ? tx.newBalance : 'N/A'}</span>
            </div>
            <div class="tx-meta-item">
              <span class="tx-meta-label">Doc ID</span>
              <span class="tx-meta-value" style="font-family:monospace; font-size:0.75rem;">${tx.id}</span>
            </div>
          </div>

          ${tx.note ? `<div class="tx-note-box"><i class="fa-regular fa-comment-dots"></i> <span>${tx.note}</span></div>` : ''}

          <div class="tx-footer-actions">
            <div>
              <span>${dateStr}</span>
              ${tx.createdBy ? `<span style="margin-left:6px; opacity:0.8;">• Admin: ${tx.createdBy}</span>` : ''}
            </div>
            <div class="tx-btn-group">
              <button class="btn-tx-opt delete" onclick="openDeleteModal('${tx.id}')">
                <i class="fa-solid fa-trash"></i> Delete
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      if (rawTransactions.length >= fetchTxLimit) {
        btnLoadMore.classList.remove("hidden");
      } else {
        btnLoadMore.classList.add("hidden");
      }
    }

    function formatBengaliDate(createdAt) {
      const ms = getSafeTime(createdAt);
      if (!ms) return "তারিখ N/A";
      const d = new Date(ms);
      const day = d.getDate();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[d.getMonth()];
      const year = d.getFullYear();
      let hrs = d.getHours();
      const mins = d.getMinutes().toString().padStart(2, '0');
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      return `${day} ${month} ${year} • ${hrs}:${mins} ${ampm}`;
    }

    window.loadMoreTransactions = function() {
      fetchTxLimit += 50;
      listenToTransactions();
    };

    // Modal Operations
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBox = document.getElementById("modalBox");

    window.closeModal = function() {
      modalBackdrop.classList.add("hidden");
      modalBox.innerHTML = "";
    };

    window.openDeleteModal = function(txId) {
      const tx = rawTransactions.find(t => t.id === txId);
      if (!tx) return;

      modalBox.innerHTML = `
        <div class="modal-header">
          <span class="modal-title">Delete Transaction</span>
          <button class="btn-modal-close" onclick="closeModal()">&times;</button>
        </div>

        <div>
          <p style="font-weight:600; color:var(--text-main); margin-bottom:8px;">আপনি কি এই Transaction History Delete করতে চান?</p>
          <div style="font-size:0.85rem; color:var(--text-muted); background:var(--bg); padding:10px; border-radius:8px;">
            <div>Doc ID: ${tx.id}</div>
            <div>Seller UID: ${tx.userId}</div>
            <div>Amount: ৳${tx.amount}</div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
          <button type="button" class="btn-modal-danger" onclick="executeDelete('${tx.id}')">Delete History</button>
        </div>
      `;

      modalBackdrop.classList.remove("hidden");
    };

    window.executeDelete = async function(txId) {
      try {
        await deleteDoc(doc(db, "users_transection", txId));
        showToast("✅ Transaction history মুছে ফেলা হয়েছে", "success");
        closeModal();
      } catch (err) {
        console.error("Delete error:", err);
        showToast("Delete করতে ব্যর্থ হয়েছে", "error");
      }
    };
  </script>
</body>
</html>
