<!DOCTYPE html>          <html lang="bn">          
<head>          
<meta charset="UTF-8">          
<meta name="viewport" content="width=device-width, initial-scale=1.0">          
<title>Admin User Manager - GHOTI MARKET</title>          
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">          
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">          
<style>          
:root{--primary:#FF6B00;--accent:#FF8C00;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--muted:#6b7280;--bg1:#FFF7ED;--bg2:#FFEDD5;}          
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;}          
body{min-height:100vh;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);padding:15px;color:#1f2937;}          
.container{max-width:1400px;margin:0 auto;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);padding:25px;border-radius:20px;border:1px solid rgba(255,107,0,.1);box-shadow:0 15px 50px rgba(255,107,0,.12);}          
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}          
.header h1{font-family:'Poppins';font-size:24px;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}          
.header a,.logout{color:var(--primary);font-weight:700;text-decoration:none;cursor:pointer;}          
.logout{color:var(--danger);}          
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;align-items:center;}          
.toolbar input{flex:1;min-width:250px;padding:12px 14px;border:2px solid #fed7aa;border-radius:10px;font-size:15px;}          
.btn{padding:11px 16px;border:none;border-radius:9px;font-weight:700;cursor:pointer;transition:.2s;font-size:14px;display:inline-flex;align-items:center;gap:6px;}          
.btn-primary{background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;}          
.btn-secondary{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}          
.btn-danger{background:var(--danger);color:#fff;}          
.btn-warning{background:var(--warning);color:#fff;}          
.btn:disabled{background:#d1d5db;cursor:not-allowed;}          
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:15px;max-height:70vh;overflow-y:auto;padding:4px;}          
.card{background:#fff;border:2px solid #ffedd5;border-radius:14px;padding:15px;position:relative;transition:.2s;}          
.card-header{display:flex;gap:12px;}          
.card-header img{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#eee;}          
.card-header h3{font-size:15px;margin-bottom:2px;}          
.card-body{margin-top:10px;font-size:12px;max-height:150px;overflow-y:auto;}          
.card-body.field{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ffedd5;}          
.card-body.field b{color:var(--muted);}          
.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}          
.badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;}          
.b-active{background:rgba(34,197,94,.15);color:var(--success);}          
.b-inactive{background:rgba(239,68,68,.15);color:var(--danger);}          /* Modal */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999;justify-content:center;align-items:center;overflow-y:auto;}
.modal-box{background:#fff;padding:25px;border-radius:18px;max-width:600px;width:95%;max-height:90vh;overflow-y:auto;}
.modal-box h3{margin-bottom:15px;}
.modal-box label{font-weight:600;font-size:13px;display:block;margin-top:10px;}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:10px;border:2px solid #fed7aa;border-radius:8px;font-size:14px;margin-top:4px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px;}
.toast{position:fixed;bottom:20px;right:20px;background:#333;color:#fff;padding:14px 20px;border-radius:10px;display:none;z-index:1000;}
.toast.show{display:block;animation:slideUp.3s;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.load-more{text-align:center;margin:15px 0;}
.loader{width:14px;height:14px;border:2px solid #ffedd5;border-top:2px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.confirm-box{background:#fff7ed;padding:12px;border-radius:8px;margin:10px 0;text-align:center;}
/* New Styling Enhancements for Description Counter & Keywords Chips */
.char-counter{font-size:11px;text-align:right;margin-top:3px;font-weight:600;color:var(--muted);}
.char-counter.error{color:var(--danger);}
.textarea-error{border-color:var(--danger)!important;}
.keyword-container{margin-top:4px;}
.keyword-input-group{display:flex;gap:8px;}
.keyword-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:100px;overflow-y:auto;}
.keyword-chip{background:#ffedd5;color:#9a3412;padding:4px 10px;border-radius:20px;font-size:12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;}
.keyword-chip span{cursor:pointer;color:var(--danger);font-weight:bold;}
.keyword-example-box{background:#fff7ed;border:1px dashed #fed7aa;padding:10px;border-radius:8px;font-size:11px;margin-top:8px;color:#7c2d12;}
.keyword-example-box ul{margin-left:15px;margin-top:4px;}
.chips-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.chip-sm{background:#ffedd5;color:#9a3412;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:600;}
.image-preview-container{margin-top:5px;display:flex;align-items:center;gap:10px;}
.image-preview-container img{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid #fed7aa;background:#eee;}
@media(max-width:768px){.grid{grid-template-columns:1fr;}}
</style>

</head>          
<body>          <div class="container" id="app" style="display:none;">          
    <div class="header">          
        <h1><i class="fas fa-users-cog"></i> Admin User Manager</h1>          
        <div class="nav">          
            <a href="dashboard.html"><i class="fas fa-arrow-left"></i> Dashboard</a>          
            <span class="logout" id="logout"><i class="fas fa-sign-out-alt"></i> Logout</span>          
        </div>          
    </div>          <div class="toolbar">          
    <input type="text" id="search" placeholder="Search: UID / Name / Email / Username / Description / WhatsApp">          
    <button class="btn btn-primary" id="addNew"><i class="fas fa-plus"></i> Add New User</button>          
</div>          
      
<div class="grid" id="grid"></div>          
<div class="load-more"><button class="btn btn-primary" id="loadMore"><i class="fas fa-plus"></i> Load More</button></div>

</div>          <!-- Edit/Add Modal -->          <div class="modal" id="editModal">          
    <div class="modal-box">          
        <h3 id="modalTitle">Edit User</h3>          
        <div id="formFields"></div>          
        <div class="modal-actions">          
            <button class="btn btn-danger" id="deleteBtn" style="margin-right:auto;"><i class="fas fa-trash"></i> Delete</button>          
            <button class="btn btn-secondary" id="cancelBtn">Cancel</button>          
            <button class="btn btn-primary" id="saveBtn">Save</button>          
        </div>          
    </div>          
</div>          <!-- Delete Confirm -->          <div class="modal" id="confirmModal">          
    <div class="modal-box" style="max-width:400px;">          
        <h3>Are you sure?</h3>          
        <div class="confirm-box">This will permanently delete this user</div>          
        <div class="modal-actions">          
            <button class="btn btn-secondary" id="confirmCancel">Cancel</button>          
            <button class="btn btn-danger" id="confirmDelete">Yes, Delete</button>          
        </div>          
    </div>          
</div>          <div class="toast" id="toast"></div>          <script type="module">          
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";          
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";          
import { getFirestore, collection, query, orderBy, limit, startAfter, getDocs, doc, updateDoc, deleteDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";          
          
const firebaseConfig = {apiKey:"AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",authDomain:"ghotimarket.firebaseapp.com",projectId:"ghotimarket"};          
const app = initializeApp(firebaseConfig);          
const auth = getAuth(app);          
const db = getFirestore(app);          
          
// ========== SECURITY ==========          
onAuthStateChanged(auth, user => {          
    try {
        if(user && user.email === "support@ghotimarket.com"){          
            document.getElementById('app').style.display = 'block';          
            loadUsers();          
        }else{          
            window.location.href = "index.html";          
        }          
    } catch(e) {
        showToast('Authentication error: ' + e.message, 'error');
    }
});          
document.getElementById('logout').onclick = () => signOut(auth);          
          
// ========== GLOBAL ==========          
const BATCH = 20;          
let lastDoc = null;          
let allUsers = [];          
let currentEditingId = null;          
let isNewUser = false;          
let dynamicEditorsState = {}; // Stores runtime state for arrays/complex editors
          
// ========== UTILS ==========          
const showToast = (msg, type='success') => {          
    try {
        const t = document.getElementById('toast');          
        t.innerText = msg; t.style.background = type==='error'?'var(--danger)':'var(--success)';          
        t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000);          
    } catch(err) {
        console.error(msg);
    }
}          
          
// ========== LOAD USERS ==========          
async function loadUsers(){          
    try {
        document.getElementById('loadMore').disabled = true;          
        let q = query(collection(db,"users"), orderBy("createdAt","desc"), limit(BATCH));          
        if(lastDoc) q = query(collection(db,"users"), orderBy("createdAt","desc"), startAfter(lastDoc), limit(BATCH));          
              
        const snap = await getDocs(q);          
        if(!snap.empty){          
            lastDoc = snap.docs[snap.docs.length-1];          
            const batch = snap.docs.map(d => ({uid:d.id,...d.data()}));          
            // Avoid duplicate pushes
            batch.forEach(newItem => {
                if(!allUsers.some(u => u.uid === newItem.uid)){
                    allUsers.push(newItem);
                    renderCard(newItem);
                }
            });          
        }          
        if(snap.size < BATCH) document.getElementById('loadMore').style.display = 'none';          
        document.getElementById('loadMore').disabled = false;          
    } catch(e) {
        showToast('Failed to load users: ' + e.message, 'error');
        document.getElementById('loadMore').disabled = false;
    }
}          
          
// ========== RENDER CARD ==========          
function renderCard(u){          
    let card = document.getElementById('card-'+u.uid);          
    if(!card){          
        card = document.createElement('div');          
        card.id = 'card-'+u.uid;          
        card.className = 'card';          
        document.getElementById('grid').appendChild(card);          
    }          
          
    const name = u.shopName || u.fullName || 'No Name';          
    const statusClass = u.active? 'b-active' : 'b-inactive';          
    const statusText = u.active? 'Active' : 'Inactive';          
          
    let fieldsHtml = '';          
    Object.keys(u).slice(0,6).forEach(key=>{          
        if(key === 'uid' || key === 'shopDescription' || key === 'shopKeywords') return;          
        fieldsHtml += `<div class="field"><b>${key}:</b> <span>${String(u[key]).substring(0,30)}</span></div>`;          
    });          
          
    let customPreviewHtml = '';
    if(u.shopDescription) {
        customPreviewHtml += `<div class="field"><b>Description:</b> <span>${String(u.shopDescription).substring(0, 60)}</span></div>`;
    }
    if(u.shopKeywords && Array.isArray(u.shopKeywords) && u.shopKeywords.length > 0) {
        let chips = u.shopKeywords.map(k => `<span class="chip-sm">${k}</span>`).join('');
        customPreviewHtml += `<div class="field" style="flex-direction:column;align-items:flex-start;gap:4px;"><b>Keywords:</b> <div class="chips-grid">${chips}</div></div>`;
    }
          
    card.innerHTML = `          
        <div class="card-header">          
            <img src="${u.shopLogo || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'">          
            <div>          
                <h3>${name}</h3>          
                <span class="badge ${statusClass}">${statusText}</span>          
                <p style="font-size:11px;color:var(--muted)">${u.email || ''}</p>          
            </div>          
        </div>          
        <div class="card-body">${customPreviewHtml}${fieldsHtml}</div>          
        <div class="card-actions">          
            <button class="btn btn-warning" onclick="openEdit('${u.uid}')"><i class="fas fa-edit"></i> Edit</button>          
            <button class="btn btn-danger" onclick="openDelete('${u.uid}')"><i class="fas fa-trash"></i> Delete</button>          
        </div>          
    `;          
}          
          
// ========== SEARCH ==========          
document.getElementById('search').oninput = e => {          
    const term = e.target.value.toLowerCase();          
    document.getElementById('grid').innerHTML = '';          
    const filtered = allUsers.filter(u => {
        return Object.keys(u).some(key => {
            const val = u[key];
            if(val === null || val === undefined) return false;
            if(Array.isArray(val)) {
                return val.some(item => String(item).toLowerCase().includes(term));
            }
            return String(val).toLowerCase().includes(term);
        });
    });          
    filtered.forEach(renderCard);          
}          
          
// ========== EDIT MODAL ==========          
window.openEdit = (uid) => {          
    isNewUser = false;          
    currentEditingId = uid;          
    const user = allUsers.find(u=>u.uid===uid);          
    document.getElementById('modalTitle').innerText = 'Edit User: ' + uid.substring(0,8);          
    document.getElementById('deleteBtn').style.display = 'inline-flex';          
    buildForm(user || {});          
    document.getElementById('editModal').style.display = 'flex';          
}          
          
document.getElementById('addNew').onclick = () => {          
    isNewUser = true;          
    currentEditingId = 'new_' + Date.now();          
    document.getElementById('modalTitle').innerText = 'Add New User';          
    document.getElementById('deleteBtn').style.display = 'none';          
    buildForm({email: '', fullName: '', shopName: '', active: true, shopDescription: '', shopKeywords: []});          
    document.getElementById('editModal').style.display = 'flex';          
}          
          
// ========== DYNAMIC FORM GENERATOR ==========
function buildForm(data){          
    const container = document.getElementById('formFields');          
    container.innerHTML = '';          
    dynamicEditorsState = {}; // Reset state cache

    // Standard baseline fields to always present if missing in new/empty items
    const defaultKeys = ['email','fullName','shopName','username','whatsapp','active','shopLogo','shopBanner','verified','shopDescription','shopKeywords'];
    const combinedKeys = Array.from(new Set([...defaultKeys, ...Object.keys(data)]));
    
    // Filter out internal UID if present
    const keysToRender = combinedKeys.filter(k => k !== 'uid');

    keysToRender.forEach(key => {
        const val = data[key] !== undefined ? data[key] : '';
        let inputHtml = '';
        
        // Specific specialized handling
        if(key === 'shopDescription') {
            const descVal = val || '';
            container.innerHTML += `
                <label>${key}</label>
                <textarea id="field-${key}" rows="3" placeholder="Enter shop description (Max 200 chars)">${descVal}</textarea>
                <div id="descCounter" class="char-counter">${descVal.length} / 200</div>
            `;
            // Bind listener later or inline check
            setTimeout(() => {
                const descTextarea = document.getElementById('field-shopDescription');
                const descCounter = document.getElementById('descCounter');
                const saveBtn = document.getElementById('saveBtn');
                if(descTextarea && descCounter) {
                    descTextarea.oninput = (e) => {
                        const len = e.target.value.length;
                        descCounter.innerText = `${len} / 200`;
                        if(len > 200) {
                            descTextarea.classList.add('textarea-error');
                            descCounter.classList.add('error');
                            saveBtn.disabled = true;
                        } else {
                            descTextarea.classList.remove('textarea-error');
                            descCounter.classList.remove('error');
                            saveBtn.disabled = false;
                        }
                    };
                }
            }, 0);
            return;
        }

        if(key === 'shopKeywords' || Array.isArray(val)) {
            dynamicEditorsState[key] = Array.isArray(val) ? [...val] : [];
            container.innerHTML += `
                <label>${key}</label>
                <div class="keyword-container" data-field-array="${key}">
                    <div class="keyword-input-group">
                        <input type="text" id="arrayInput-${key}" placeholder="Add item and press enter">
                        <button type="button" class="btn btn-primary" onclick="window.addArrayItem('${key}')" style="padding: 8px 12px;"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="arrayLimitMsg-${key}" style="font-size:11px;color:var(--danger);margin-top:2px;display:none;">Maximum limit reached</div>
                    <div class="keyword-list" id="arrayListContainer-${key}"></div>
                    ${key === 'shopKeywords' ? `
                    <div class="keyword-example-box">
                        <b>কিভাবে Keyword লিখবেন?</b>
                        <ul><li>fashion, shirt, mens clothing, shoes, cosmetics</li></ul>
                        <div style="margin-top:4px;color:var(--danger);font-size:10px;">
                            ❌ Phone Number লিখবেন না | ❌ Shop Name লিখবেন না | ❌ একই Keyword বারবার লিখবেন না
                        </div>
                    </div>` : ''}
                </div>
            `;
            setTimeout(() => renderArrayChips(key), 0);
            return;
        }

        // Automatic type detection rules
        if(typeof val === 'boolean' || key === 'active' || key === 'verified') {
            inputHtml = `<select id="field-${key}">
                <option value="true" ${val===true?'selected':''}>True</option>
                <option value="false" ${val===false?'selected':''}>False</option>
            </select>`;
        } else if(val && typeof val === 'object' && val.seconds !== undefined) {
            // Firestore Timestamp detection
            const dateStr = new Date(val.seconds * 1000).toLocaleString();
            inputHtml = `<input type="text" id="field-${key}" value="${dateStr}" readonly style="background:#f1f5f9;cursor:not-allowed;">`;
        } else if(val && typeof val === 'object') {
            // General Object / Map
            inputHtml = `<textarea id="field-${key}" rows="3">${JSON.stringify(val, null, 2)}</textarea>`;
        } else if(typeof val === 'number') {
            inputHtml = `<input type="number" id="field-${key}" value="${val}">`;
        } else if(typeof val === 'string' && (key.toLowerCase().includes('logo') || key.toLowerCase().includes('banner') || val.startsWith('http'))) {
            inputHtml = `
                <input type="text" id="field-${key}" value="${val}" placeholder="Image URL">
                <div class="image-preview-container">
                    <img src="${val || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'">
                    <span style="font-size:11px;color:var(--muted);">Image Preview</span>
                </div>
            `;
        } else if(typeof val === 'string' && val.length > 100) {
            inputHtml = `<textarea id="field-${key}" rows="4">${val}</textarea>`;
        } else {
            inputHtml = `<input type="text" id="field-${key}" value="${val !== null && val !== undefined ? val : ''}">`;
        }

        container.innerHTML += `<label>${key}</label>${inputHtml}`;
    });          
}          

// Helper for dynamic array/chip editors inside modals
window.addArrayItem = (key) => {
    const inputEl = document.getElementById(`arrayInput-${key}`);
    if(!inputEl) return;
    const val = inputEl.value.trim();
    if(!val) return;
    
    if(!dynamicEditorsState[key]) dynamicEditorsState[key] = [];
    
    if(key === 'shopKeywords' && dynamicEditorsState[key].length >= 10) {
        showToast('Maximum 10 keywords allowed', 'error');
        return;
    }
    if(dynamicEditorsState[key].includes(val)) {
        showToast('Duplicate entry not allowed', 'error');
        return;
    }
    
    dynamicEditorsState[key].push(val);
    inputEl.value = '';
    renderArrayChips(key);
};

window.removeArrayItem = (key, index) => {
    if(dynamicEditorsState[key]) {
        dynamicEditorsState[key].splice(index, 1);
        renderArrayChips(key);
    }
};

function renderArrayChips(key) {
    const container = document.getElementById(`arrayListContainer-${key}`);
    const inputEl = document.getElementById(`arrayInput-${key}`);
    const limitMsg = document.getElementById(`arrayLimitMsg-${key}`);
    if(!container) return;

    container.innerHTML = '';
    const items = dynamicEditorsState[key] || [];
    
    items.forEach((item, index) => {
        const chip = document.createElement('div');
        chip.className = 'keyword-chip';
        chip.innerHTML = `${item} <span onclick="window.removeArrayItem('${key}', ${index})">&times;</span>`;
        container.appendChild(chip);
    });

    if(key === 'shopKeywords' && items.length >= 10) {
        if(inputEl) inputEl.disabled = true;
        if(limitMsg) limitMsg.style.display = 'block';
    } else {
        if(inputEl) inputEl.disabled = false;
        if(limitMsg) limitMsg.style.display = 'none';
    }
}
          
document.getElementById('cancelBtn').onclick = () => document.getElementById('editModal').style.display = 'none';          
          
// ========== SAVE ==========          
document.getElementById('saveBtn').onclick = async () => {          
    try {
        const data = {};          
        document.querySelectorAll('#formFields input, #formFields select, #formFields textarea').forEach(inp => {          
            if(inp.id && inp.id.startsWith('field-')) {
                const key = inp.id.replace('field-','');          
                let val = inp.value;          
                if(val === 'true') val = true;          
                else if(val === 'false') val = false;          
                else if(inp.type === 'number' && val !== '') val = Number(val);          
                else {
                    try {
                        // Check if it's JSON object text
                        if(val.startsWith('{') && val.endsWith('}')) {
                            val = JSON.parse(val);
                        }
                    } catch(err) {}
                }
                data[key] = val;          
            }
        });          

        // Merge runtime dynamic arrays state
        Object.keys(dynamicEditorsState).forEach(arrayKey => {
            data[arrayKey] = dynamicEditorsState[arrayKey];
        });

        data.updatedAt = serverTimestamp();          
              
        if(isNewUser){          
            await setDoc(doc(db,"users",currentEditingId), data);          
            const newEntry = {uid: currentEditingId, ...data};
            allUsers.unshift(newEntry);          
            renderCard(newEntry);
        }else{          
            await updateDoc(doc(db,"users",currentEditingId), data);          
            const user = allUsers.find(u=>u.uid===currentEditingId);          
            if(user) Object.assign(user, data);          
            renderCard(allUsers.find(u=>u.uid===currentEditingId));          
        }          
        document.getElementById('editModal').style.display = 'none';          
        showToast('Saved Successfully');          
    } catch(e) { 
        showToast('Error saving data: '+e.message, 'error'); 
    }          
}          
          
// ========== DELETE ==========          
window.openDelete = (uid) => {          
    currentEditingId = uid;          
    document.getElementById('confirmModal').style.display = 'flex';          
}          
document.getElementById('confirmCancel').onclick = () => document.getElementById('confirmModal').style.display = 'none';          
document.getElementById('confirmDelete').onclick = async () => {          
    try {          
        await deleteDoc(doc(db,"users",currentEditingId));          
        allUsers = allUsers.filter(u => u.uid !== currentEditingId);          
        const cardElem = document.getElementById('card-'+currentEditingId);
        if(cardElem) cardElem.remove();          
        document.getElementById('confirmModal').style.display = 'none';          
        showToast('Deleted Successfully');          
    } catch(e) { 
        showToast('Delete Failed: ' + e.message, 'error'); 
        document.getElementById('confirmModal').style.display = 'none';
    }          
}          
          
document.getElementById('loadMore').onclick = loadUsers;          
</script>          </body>
